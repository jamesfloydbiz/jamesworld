<style>

  --neg3:#814720; --neg2:#c08b63; --neg1:#eacab0; --mid:#ece7df; --pos1:#b5dba0; --pos2:#76a864; --pos3:#2e602a;

    --line:#2c2c2a; --line-2:#3d3d3a; --accent:#f2b705; --accent-fill:#f2b705;
    --neg3:#f9a870; --neg2:#ae653a; --neg1:#643d20; --mid:#27241f; --pos1:#254e1c; --pos2:#48823b; --pos3:#89cc72;
    --nodata:#262625; --map-edge:rgba(255,255,255,.10); --map-state:rgba(255,255,255,.55);
    --drv-move:#3987e5; --drv-birth:#d95926; --drv-imm:#199e70; --drv-obs:#8f8d86;
    --good:#9fd88a; --bad:#d9a066;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0f0f0e; --surface:#1a1a19; --raise:#222221;
  --ink:#f4f4f1; --ink-2:#c3c2b7; --muted:#a3a198; --axis:#8f8d86;
  --line:#2c2c2a; --line-2:#3d3d3a; --accent:#f2b705; --accent-fill:#f2b705;
  --neg3:#f9a870; --neg2:#ae653a; --neg1:#643d20; --mid:#27241f; --pos1:#254e1c; --pos2:#48823b; --pos3:#89cc72;
  --nodata:#262625; --map-edge:rgba(255,255,255,.10); --map-state:rgba(255,255,255,.55);
  --drv-move:#3987e5; --drv-birth:#d95926; --drv-imm:#199e70; --drv-obs:#8f8d86;
  --good:#9fd88a; --bad:#d9a066;
}
*{box-sizing:border-box}
.home-link{display:inline-block; margin:0 0 14px; font-family:var(--mono); font-size:11px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-decoration:none;}
.home-link:hover,.home-link:focus-visible{color:var(--ink);}
[hidden]{display:none!important}
body{background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45}
.app{max-width:1440px; margin:0 auto; padding-inline:clamp(16px,2.4vw,32px); padding-block:18px 48px; display:flex; flex-direction:column; gap:14px}
h1,h2,h3{text-wrap:balance; margin:0}
h1{font-size:clamp(22px,2.6vw,30px); font-weight:800; letter-spacing:-.02em}
h2{font-size:19px; font-weight:700; letter-spacing:-.01em}
h3{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2)}
a{color:inherit; text-decoration-color:var(--line-2); text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent-fill); outline-offset:2px}
.top{display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:12px 24px}
.thesis{margin:4px 0 0; color:var(--ink-2); max-width:62ch}
.controls{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:end; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.ctl{display:flex; flex-direction:column; gap:4px; min-width:0}
.ctl > label,.ctl > .lab{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
select,input[type=search]{font:500 14px var(--sans); color:var(--ink); background:var(--raise); border:1px solid var(--line-2); border-radius:7px; padding:7px 9px; max-width:100%}
.seg{display:inline-flex; border:1px solid var(--line-2); border-radius:7px; overflow:hidden}
.seg button{font:600 13px var(--sans); border:0; background:var(--raise); color:var(--ink-2); padding:8px 11px; cursor:pointer; font-variant-numeric:tabular-nums}
.seg button + button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.seg button.far{font-style:italic; text-decoration:underline dotted; text-underline-offset:3px}
.search{position:relative; flex:1 1 200px; max-width:320px}
.search input{width:100%}
#qres{position:absolute; top:100%; left:0; right:0; z-index:20; margin:4px 0 0; padding:4px; list-style:none; background:var(--raise); border:1px solid var(--line-2); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.14); max-height:300px; overflow:auto}
#qres li{padding:7px 9px; border-radius:6px; cursor:pointer}
#qres li[aria-selected="true"],#qres li:hover{background:var(--line)}
#qres small{color:var(--muted)}
.found{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
.found h2{margin:0 0 8px; font-size:15px}
.found ul{margin:0; padding-left:18px; display:grid; gap:5px; font-size:14px; color:var(--ink-2)}
.found li b{color:var(--ink); font-variant-numeric:tabular-nums}
.found .note{margin-top:9px}
.headline{margin:0; font-size:15px; color:var(--ink-2)}
.headline b{color:var(--ink); font-variant-numeric:tabular-nums}
/* The map is the page, so it leaves the reading column and runs the width of
   the window less a small margin. --vw is the viewport WITHOUT the scrollbar,
   set from JS: 100vw includes it and the page would scroll sideways. */
.stage{--m:14px; width:calc(var(--vw, 100vw) - var(--m) * 2);
  margin-inline:calc((var(--vw, 100vw) - var(--m) * 2 - 100%) / -2)}
.mapwrap{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:8px}
/* Height is bound to the window, not to the width: at full bleed an aspect
   ratio would make the map taller than the screen on any wide monitor. */
#map{width:100%; height:clamp(380px, 68vh, 860px); display:block; touch-action:none; cursor:crosshair}

/* The number the map is about, kept in the corner of the map while you pan. */
.hbox{position:absolute; top:52px; right:24px; z-index:3; pointer-events:none;
  background:var(--raise, var(--surface)); border:1px solid var(--line-2); border-radius:10px;
  padding:9px 13px; box-shadow:0 6px 22px rgba(0,0,0,.16); max-width:min(260px, 42vw)}
.hbox .k{font:500 10px var(--mono); letter-spacing:.11em; text-transform:uppercase; color:var(--muted); display:block}
.hbox .v{font-size:26px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; display:block; margin-top:2px}
.hbox .s{font-size:11px; color:var(--ink-2); display:block; margin-top:2px}

/* Zoom, without needing to know about Ctrl-scroll. */
.zoomers{position:absolute; top:52px; left:24px; z-index:3; display:flex; flex-direction:column; gap:4px}
.zoomers button{width:32px; height:32px; border-radius:8px; border:1px solid var(--line-2);
  background:var(--raise, var(--surface)); color:var(--ink); font:600 17px/1 var(--sans); cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.zoomers button:hover{border-color:var(--ink-2)}
/* A word does not fit a 32px square, and shrinking it until it did made it
   unreadable. The glyph matches the + and - beside it. */
.zoomers button.rs{font-size:19px; line-height:1}
.legend{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; font-size:12px; color:var(--ink-2)}
.legend .ttl{font-weight:700; color:var(--ink)}
.swatches{display:flex; flex-wrap:wrap; gap:6px 4px; min-width:0}
.sw{display:flex; flex-direction:column; align-items:center; gap:3px; font-variant-numeric:tabular-nums; flex:1 0 auto; min-width:50px}
.sw i{display:block; width:100%; height:12px; border-radius:2px}
.sw span{font-size:11px; color:var(--muted); white-space:nowrap}
.cat{display:inline-flex; align-items:center; gap:6px}
.cat i{width:12px; height:12px; border-radius:2px; display:inline-block}
.mapfoot{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.ghost{font:600 12px var(--sans); background:transparent; border:1px solid var(--line-2); color:var(--ink-2); border-radius:6px; padding:5px 9px; cursor:pointer}
.tip{position:absolute; pointer-events:none; z-index:10; background:var(--raise); color:var(--ink); border:1px solid var(--line-2); border-radius:8px; padding:8px 10px; font-size:12px; box-shadow:0 6px 18px rgba(0,0,0,.16); max-width:260px}
.tip b{display:block; font-size:13px}
.tip .v{font-variant-numeric:tabular-nums; font-weight:700}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px;
  display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap:14px 20px;
  align-items:start; min-width:0}
/* The place being described heads the tile across its whole width; the blocks
   about it sit side by side underneath. */
.panel > :first-child{grid-column:1 / -1}
.panel .blk{min-width:0}
.panel .kind{font:500 11px var(--mono); color:var(--muted); letter-spacing:.02em}
.panel .sub{color:var(--ink-2); font-size:13px}
.blk{display:flex; flex-direction:column; gap:8px; padding-top:12px; border-top:1px solid var(--line)}
.big{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.big .n{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1}
.big .u{color:var(--ink-2); font-size:13px}
.neg{color:var(--bad)} .pos{color:var(--good)}
.scen{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.scen b{color:var(--ink)}
.note{font-size:12px; color:var(--muted); margin:0}
.bars{display:grid; grid-template-columns:auto 1fr auto; gap:6px 8px; align-items:center; font-size:12px}
.bars .lb{color:var(--ink-2); white-space:nowrap}
.bars .track{position:relative; height:12px}
.bars .track::before{content:""; position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--line-2)}
.bars .bar{position:absolute; top:0; height:12px; border-radius:2px}
.bars .val{font-variant-numeric:tabular-nums; font-weight:600; text-align:right; min-width:4.5ch}
svg.chart{width:100%; height:auto; display:block; overflow:visible}
svg.chart text{fill:var(--muted); font:11px var(--sans); font-variant-numeric:tabular-nums}
.kv{display:grid; grid-template-columns:1fr auto; gap:4px 12px; font-size:13px}
.kv span:nth-child(odd){color:var(--ink-2)}
.kv span:nth-child(even){font-variant-numeric:tabular-nums; font-weight:600; text-align:right}
.rank{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:10px}
.rank-head{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:end; justify-content:space-between}
.rank-ctl{display:flex; flex-wrap:wrap; gap:10px; align-items:end}
.tablewrap{overflow-x:auto; border-top:1px solid var(--line)}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:760px}
th{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); text-align:right; padding:8px 8px; border-bottom:1px solid var(--line-2); white-space:nowrap; cursor:pointer; user-select:none}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th[aria-sort] {color:var(--ink)}
td{padding:7px 8px; border-bottom:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--line)}
tbody tr[aria-selected="true"]{background:color-mix(in srgb, var(--accent-fill) 18%, transparent)}
td .chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-2)}
td .chip i{width:9px; height:9px; border-radius:2px; display:inline-block}
.more{align-self:flex-start}
.method{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; display:flex; flex-direction:column; gap:10px}
.card p,.card li{max-width:68ch; color:var(--ink-2)}
.card p{margin:0}
.card ol,.card ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}
.acc{overflow-x:auto}
.acc table{min-width:0; font-size:12px}
.acc td,.acc th{padding:5px 6px; cursor:default}
.warnbox{border-left:3px solid var(--accent-fill); padding:8px 12px; background:color-mix(in srgb, var(--accent-fill) 10%, transparent); border-radius:0 6px 6px 0}
.math{border-top:1px solid var(--line); padding-top:10px}
.math summary{cursor:pointer; font-weight:700; font-size:13px}
.math ol{margin:8px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:8px; color:var(--ink-2); font-size:13px}
.math b{color:var(--ink)} .math .eq{font:12px var(--mono); color:var(--ink); background:var(--line); padding:1px 5px; border-radius:4px}
.math table{font-size:12px; min-width:0; margin-top:4px} .math td,.math th{padding:3px 5px}
.math .src{font-size:11px; color:var(--muted)} .math .src a{color:var(--muted)}
.srcs{font:12px var(--mono); color:var(--ink-2); display:flex; flex-direction:column; gap:4px; overflow-wrap:anywhere}
footer{font-size:12px; color:var(--muted)}
@media (max-width: 720px){
  .stage{--m:8px}
  .hbox{top:auto; bottom:52px; right:14px; padding:7px 10px}
  .hbox .v{font-size:20px}
  .zoomers{top:auto; bottom:52px; left:14px; flex-direction:row}
}
@media (max-width: 520px){ .sw{min-width:42px} .big .n{font-size:28px} .legend .ttl{flex-basis:100%} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>

<div class="app">
  <a class="home-link" href="/education/">← James' Education Dashboards</a>
  <header class="top">
    <div>
      <h1>School Outlook Map</h1>
      <p class="thesis">How many U.S. public school students there will be through 2055, as births, moving and immigration change.</p>
    </div>
  </header>

  <div class="controls">
    <div class="ctl"><label for="geo">Map by</label>
      <select id="geo"><option value="c">County</option><option value="d">School district</option><option value="s">High school district</option></select></div>
    <div class="ctl"><span class="lab" id="hlab">Year</span>
      <div class="seg" id="horizon" role="group" aria-labelledby="hlab"><button data-h="0" aria-pressed="false">2030</button><button data-h="1" aria-pressed="false">2035</button><button data-h="2" aria-pressed="true">2040</button><button data-h="3" aria-pressed="false" class="far" title="Beyond the 15-year range tested against real outcomes">2045</button><button data-h="4" aria-pressed="false" class="far" title="Beyond the 15-year range tested against real outcomes">2050</button><button data-h="5" aria-pressed="false" class="far" title="Beyond the 15-year range tested against real outcomes">2055</button></div></div>
    <div class="ctl"><label for="scen">Immigration</label>
      <select id="scen"><option value="0">Continues at the 2021–25 pace</option><option value="1" selected>Stays at the 2025 level</option><option value="2">Drops to near zero</option></select></div>
    <div class="ctl"><label for="fert">Births</label>
      <select id="fert"><option value="1" selected>Keep falling 1.4% a year</option><option value="0">Stay at the 2025 rate</option></select></div>
    <div class="ctl"><label for="metric-o">Color by</label>
      <select id="metric-o"><option value="pct">% change in students</option><option value="n">Students gained or lost</option><option value="drv">Biggest reason for decline</option></select></div>
    <div class="ctl"><label for="state">State</label><select id="state"><option value="">All states</option></select></div>
    <div class="ctl search"><label for="q">Find a place</label>
      <input id="q" type="search" placeholder="County or school district" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="qres">
      <ul id="qres" role="listbox" hidden></ul></div>
  </div>

  <section class="card found" id="found" aria-label="What the data shows"></section>

  <main class="stage">
    <section class="mapwrap" aria-label="Map">
      <div class="legend" id="legend"></div>
      <div class="zoomers">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">−</button>
        <button type="button" id="zrs" class="rs" aria-label="Reset the view" title="Reset the view">↺</button>
      </div>
      <div class="hbox" id="hbox" aria-hidden="true"></div>
      <canvas id="map" role="img" aria-label="Map of the United States colored by the selected measure. The table below lists the same values."></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="mapfoot"><span id="mapnote"></span><span><button class="ghost" id="reset">Reset view</button></span></div>
    </section>
  </main>

  <p class="headline" id="headline"></p>

  <aside class="panel" id="panel" aria-live="polite"></aside>

  <section class="rank" aria-labelledby="rank-title">
    <div class="rank-head">
      <div><h2 id="rank-title">Most affected places</h2><p class="note" id="rank-note"></p></div>
      <div class="rank-ctl">
        <div class="ctl"><span class="lab" id="scopelab">Rank</span>
          <div class="seg" id="scope" role="group" aria-labelledby="scopelab">
            <button data-scope="place" aria-pressed="true">Places</button><button data-scope="st" aria-pressed="false">States</button></div></div>
        <div class="ctl" id="minnwrap"><label for="minn">Minimum students</label>
          <select id="minn"><option value="0">Any size</option><option value="500" selected>500+</option><option value="2000">2,000+</option><option value="10000">10,000+</option><option value="50000">50,000+</option></select></div>
        <div class="ctl" id="typewrap"><label for="dtype">District type</label>
          <select id="dtype"><option value="all">All</option><option value="reg" selected>Regular districts</option><option value="charter">Charter-only</option></select></div>
        <button class="ghost" id="copy">Copy table as CSV</button>
      </div>
    </div>
    <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <button class="ghost more" id="more">Show 50 more</button>
  </section>

  <section class="method" id="method" aria-label="How this works"></section>
  <footer id="foot"></footer>
