  <style>
    /* Scoped to this page. The site's own .photo-frame greyscales its images and
       puts a 2px white border round them -- right for the Memories wall, wrong
       for work that was graded in colour, so the gallery here is its own thing. */
    .ph-grid { columns: 1; column-gap: 14px; }
    @media (min-width: 560px)  { .ph-grid { columns: 2; } }
    @media (min-width: 900px)  { .ph-grid { columns: 3; } }
    @media (min-width: 1360px) { .ph-grid { columns: 4; } }

    .ph-item { break-inside: avoid; margin: 0 0 14px; }
    .ph-btn {
      display: block; width: 100%; padding: 0; border: 0; background: none;
      cursor: zoom-in; line-height: 0;
    }
    .ph-btn img {
      width: 100%; height: auto; display: block;
      background: var(--secondary-bg);
      transition: opacity .25s ease;
    }
    .ph-btn:hover img, .ph-btn:focus-visible img { opacity: .72; }
    .ph-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    .ph-cap {
      font-family: var(--font-mono); font-size: .68rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--fg-55); margin: 8px 2px 0;
    }

    /* Lightbox. A native <dialog> so Esc and the top layer come for free. */
    #ph-lb[open] {
      position: fixed; inset: 0; width: 100vw; max-width: 100vw;
      height: 100vh; max-height: 100vh; margin: 0; padding: 0;
      border: 0; border-radius: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    #ph-lb::backdrop { background: #000; }
    #ph-lb img { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; }
    .ph-lb__bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 18px; background: linear-gradient(to top, hsl(0 0% 0% / .85), transparent);
      font-family: var(--font-mono); font-size: .7rem; letter-spacing: .12em;
      text-transform: uppercase; color: var(--fg-70); pointer-events: none;
    }
    .ph-lb__bar button { pointer-events: auto; }
    .ph-nav {
      background: none; border: 1px solid var(--fg-25); color: var(--fg-70);
      font: inherit; letter-spacing: .12em; padding: 7px 14px; cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .ph-nav:hover { color: var(--fg); border-color: var(--fg-45); }
    .ph-lb__mid { flex: 1; text-align: center; }
    @media (prefers-reduced-motion: reduce) { .ph-btn img { transition: none; } }
  </style>

  <script>
  (function () {
    var slugs = ["siren-nights","deli-grocery-oct-9-2026","dsc09621","dsc09623","dsc09649","dsc09776","dsc09847","dsc09849","dsc09850","dsc00052","dsc00066","dsc00069","dsc00084","dsc00089","dsc00093","dsc00095","dsc00096","dsc00115","dsc00123","dsc00124","dsc00125","dsc00128","dsc00135","dsc00138","dsc00156","dsc00170","dsc00171","dsc00174","dsc00187","dsc00191","dsc00194","dsc00198","dsc00204","dsc00208","dsc00254","dsc00281","dsc00337","dsc00340","dsc00350","dsc00351","dsc00355","dsc00356","dsc00362","dsc00364","dsc00365","dsc00367","dsc00369","dsc00370","dsc00376","dsc00390","dsc00391","dsc00403","dsc00404","dsc00411","dsc00423","dsc00424","dsc00430","dsc00432","dsc00460","dsc00478","dsc00535","dsc00537","dsc00558","dsc00565","dsc00641","dsc00715","dsc00734","dsc00737","dsc00739","dsc00740","dsc00744","dsc00746"];
    var caps  = ["Siren Nights","Deli Grocery Oct 9, 2026","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","",""];
    var lb    = document.getElementById('ph-lb');
    var img   = document.getElementById('ph-lb-img');
    var meta  = document.getElementById('ph-lb-meta');
    var i     = 0;

    function show(n) {
      i = (n + slugs.length) % slugs.length;
      img.src = '/photography/full/' + slugs[i] + '.jpg';
      img.alt = caps[i] || ('Photograph ' + (i + 1) + ' of ' + slugs.length);
      meta.textContent = caps[i] ? caps[i] : (i + 1) + ' / ' + slugs.length;
      // Warm the neighbours so Prev/Next do not flash.
      [i + 1, i - 1].forEach(function (k) {
        var s = slugs[(k + slugs.length) % slugs.length];
        new Image().src = '/photography/full/' + s + '.jpg';
      });
    }

    document.querySelectorAll('.ph-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        show(parseInt(b.dataset.i, 10));
        if (lb.showModal) lb.showModal(); else lb.setAttribute('open', '');
      });
    });

    document.getElementById('ph-prev').addEventListener('click', function () { show(i - 1); });
    document.getElementById('ph-next').addEventListener('click', function () { show(i + 1); });
    document.getElementById('ph-close').addEventListener('click', function () { lb.close(); });

    // Clicking the photo itself steps forward; clicking the letterboxed black
    // around it closes -- the behaviour people expect from a lightbox.
    lb.addEventListener('click', function (e) {
      if (e.target === img) show(i + 1);
      else if (e.target === lb) lb.close();
    });

    document.addEventListener('keydown', function (e) {
      if (!lb.open) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); show(i + 1); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); show(i - 1); }
    });
  })();
  </script>
