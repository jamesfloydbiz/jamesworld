  <!-- The deck sets its own type: Fraunces for headlines, DM Sans for everything else. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400..700&family=DM+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .lock { max-width: 24rem; margin-top: 2rem; }
    .lock label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--fg-55);
      margin-bottom: 8px;
    }
    .lock__row { display: flex; gap: 8px; }
    .lock input {
      flex: 1;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 12px;
      font: inherit;
    }
    .lock input:focus { outline: none; border-color: var(--fg-70); }
    .lock button {
      background: var(--fg);
      color: var(--bg);
      border: 0;
      border-radius: 4px;
      padding: 10px 16px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .lock__error { color: var(--fg-70); font-size: 0.9rem; min-height: 1.4em; margin-top: 8px; }
    .flyer { width: 100%; max-width: 30rem; border-radius: 4px; display: block; margin: 2rem 0; }

    /* --- The plan, shown after unlock ----------------------------------- */
    .plan-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 2.5rem 0 1.5rem; }
    .plan-tabs button {
      background: transparent;
      color: var(--fg-55);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .plan-tabs button:hover { color: var(--fg-85); border-color: var(--fg-70); }
    .plan-tabs button.is-on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .plan-panel[hidden] { display: none; }

    /* The deck. Each slide is a 1920x1080 canvas with all its styles inline,
       exactly as written; the stage scales it down to the column width. */
    .deck__stage { position: relative; width: 100%; overflow: hidden; border-radius: 4px; background: #2B1E2F; }
    .deck__canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: top left; }
    .deck__slide { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
    .deck__slide.is-on { display: block; }
    .deck__slide > section { position: relative; width: 1920px; height: 1080px; box-sizing: border-box; overflow: hidden; }
    .deck__slide aside { display: none; }          /* speaker notes go under the bar */
    .deck__slide ul, .deck__slide ol { margin: 0; padding-left: 1.2em; }
    .deck__slide table { border-collapse: collapse; width: 100%; }
    .deck__slide th, .deck__slide td { padding: 14px 20px 14px 0; text-align: left; vertical-align: top; }
    .deck__slide th { font-weight: 700; }
    .deck__bar {
      display: flex; align-items: center; gap: 14px; margin-top: 12px;
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; color: var(--fg-55);
    }
    .deck__bar button {
      background: transparent; color: var(--fg-85);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 6px 14px; cursor: pointer; font: inherit;
    }
    .deck__bar button:hover { border-color: var(--fg-70); }
    .deck__notes { margin-top: 14px; color: var(--fg-70); font-size: 0.92rem; line-height: 1.65; }
    .deck__notes:empty { display: none; }

    /* The questionnaire and the run of show. */
    .doc { line-height: 1.7; }
    .doc h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0 0 0.3rem; }
    .doc h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 2.2rem 0 0.7rem; }
    .doc p { margin: 0 0 1rem; }
    /* site.css resets every list to list-style:none; these want their markers. */
    .doc ul { list-style: disc; margin: 0 0 1.2rem; padding-left: 1.3em; }
    .doc ol { list-style: decimal; margin: 0 0 1.2rem; padding-left: 1.6em; }
    .doc li { margin-bottom: 0.4rem; }
    .doc ul.doc__check { list-style: none; padding-left: 0; }
    .doc li::marker { color: var(--fg-55); }
    .doc a { color: var(--fg-85); text-decoration: underline; text-underline-offset: 3px; }
    .doc__scroll { overflow-x: auto; margin: 0 0 1.4rem; }
    .doc table { border-collapse: collapse; width: 100%; min-width: 32rem; font-size: 0.88rem; }
    .doc th, .doc td { border-bottom: 1px solid var(--border); padding: 10px 16px 10px 0; text-align: left; vertical-align: top; }
    .doc th {
      font-family: var(--font-mono); font-size: 0.64rem; font-weight: 400;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-55);
    }
  </style>
</head>

    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    async function open(pw) {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(SEALED.salt), iterations: SEALED.iterations, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(SEALED.iv) }, key, b64(SEALED.data));
      return new TextDecoder().decode(plain);
    }
    async function unlock(pw, remember) {
      const html = await open(pw);
      document.getElementById('locked').innerHTML = html;
      if (remember) { try { sessionStorage.setItem('fdou', pw); } catch (e) {} }
      initPlan();
    }
    document.getElementById('lock').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('lock-error');
      err.textContent = '';
      try { await unlock(document.getElementById('pw').value, true); }
      catch (e) { err.textContent = 'Wrong password.'; }
    });
    // The sealed markup arrives through innerHTML, so its scripts never run —
    // the tabs and the deck are driven from here instead.
    function initPlan() {
      const tabs = [...document.querySelectorAll('#plan-tabs button')];
      tabs.forEach(t => t.addEventListener('click', () => {
        tabs.forEach(o => {
          const on = o === t;
          o.classList.toggle('is-on', on);
          o.setAttribute('aria-selected', String(on));
          document.getElementById('panel-' + o.dataset.panel).hidden = !on;
        });
        if (t.dataset.panel === 'deck') fit();
      }));

      const stage = document.getElementById('deck-stage');
      const canvas = document.getElementById('deck-canvas');
      const slides = [...document.querySelectorAll('.deck__slide')];
      if (!stage || !slides.length) return;
      const notes = document.getElementById('deck-notes');
      const count = document.getElementById('deck-count');
      let i = 0;

      function fit() {
        const k = stage.clientWidth / 1920;
        canvas.style.transform = 'scale(' + k + ')';
        stage.style.height = Math.round(1080 * k) + 'px';
      }
      function show(n) {
        i = (n + slides.length) % slides.length;
        slides.forEach((s, k) => s.classList.toggle('is-on', k === i));
        count.textContent = (i + 1) + ' / ' + slides.length;
        const aside = slides[i].querySelector('aside');
        notes.textContent = aside ? aside.textContent.trim() : '';
      }
      document.getElementById('deck-prev').addEventListener('click', () => show(i - 1));
      document.getElementById('deck-next').addEventListener('click', () => show(i + 1));
      document.addEventListener('keydown', e => {
        if (document.getElementById('panel-deck').hidden) return;
        if (e.target.matches('input, textarea')) return;
        if (e.key === 'ArrowRight') show(i + 1);
        else if (e.key === 'ArrowLeft') show(i - 1);
      });
      addEventListener('resize', fit);
      fit();
      show(0);
    }

    try { const saved = sessionStorage.getItem('fdou'); if (saved) unlock(saved, false).catch(() => {}); } catch (e) {}
  </script>
