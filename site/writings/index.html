<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Writing — James Floyd</title>
  <!-- /writings (plural) is an alias for the canonical /writing/ page. -->
  <link rel="canonical" href="https://jamesfloyds.world/writing/">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=/writing/">
  <script>window.location.replace('/writing/' + window.location.hash);</script>
  <style>
    body { background:#000; color:#ddd; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; margin:0; }
    a { color:#fff; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="/writing/">/writing/</a>…</p>
  <!-- GoatCounter: pageview counts only. No cookies, nothing stored per visitor.
       Guarded on the hostname so local previews and builds stay out of the stats. -->
  <script>
    if (location.hostname === 'jamesfloyds.world') {
      var gc = document.createElement('script');
      gc.async = true;
      gc.src = 'https://gc.zgo.at/count.js';
      gc.setAttribute('data-goatcounter', 'https://jamesfloyd.goatcounter.com/count');
      document.head.appendChild(gc);
    }
  </script>
</body>
</html>
