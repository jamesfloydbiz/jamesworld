<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Climbing Machine</title>
<meta name="description" content="Climbing Machine — a picture book. Read it cover to cover.">
<link rel="canonical" href="https://jamesfloyds.world/builds/climbing-machine/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════════
     The book, and nothing else. Pages are the real 40-page print build
     rendered at 216 dpi and trimmed of their bleed, so what you flip
     through here is exactly what comes off the press — plus the wrap's
     front and back panels as the covers.

     The flip is a stack of leaves rotating about their spine edge. Each
     leaf carries two faces, back-face hidden, so one rotation turns one
     sheet and reveals the two pages beneath it.
     ═══════════════════════════════════════════════════════════════════ */
  :root{
    --paper:#faf7ef;
    --ink:#e8e4db;
    --dim:rgba(232,228,219,.5);
    --flip:.78s;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:#08090b; color:var(--ink);
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  /* a warm pool of light under the book, so it reads as an object on a table */
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 70% 55% at 50% 48%, rgba(255,236,200,.10), transparent 70%);
  }

  .stage{
    position:relative; z-index:1;
    perspective:2600px; perspective-origin:50% 46%;
    width:min(92vw, 1180px);
  }

  /* The book is two page-widths wide. Aspect 8:10 per page → 16:10 open. */
  .book{
    position:relative; margin:0 auto;
    width:100%; aspect-ratio:16 / 10;
    transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.2,.7,.3,1);
    transform:translateX(-25%);          /* closed: the shut book sits centred */
  }
  .book.open{transform:translateX(0);}

  /* the slab under the leaves — gives the closed book some thickness */
  .block{
    position:absolute; top:0; left:50%; width:50%; height:100%;
    background:#1a1712; border-radius:2px 5px 5px 2px;
    box-shadow:0 30px 70px -25px rgba(0,0,0,.9), 0 2px 10px rgba(0,0,0,.6);
  }

  .leaf{
    position:absolute; top:0; left:50%; width:50%; height:100%;
    transform-origin:left center; transform-style:preserve-3d;
    transition:transform var(--flip) cubic-bezier(.42,0,.35,1);
  }
  .leaf.flipped{transform:rotateY(-180deg);}

  .face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--paper) center/cover no-repeat;
    overflow:hidden;
  }
  .face img{display:block; width:100%; height:100%; object-fit:cover;}
  .face.back{transform:rotateY(180deg);}
  /* gutter shading — the page darkens as it curves into the spine */
  .face::after{
    content:''; position:absolute; top:0; bottom:0; width:7%; pointer-events:none;
  }
  .face.front::after{left:0;  background:linear-gradient(90deg, rgba(0,0,0,.22), transparent);}
  .face.back::after {right:0; background:linear-gradient(270deg, rgba(0,0,0,.22), transparent);}

  /* click targets */
  .zone{position:absolute; top:0; height:100%; width:50%; z-index:60; cursor:pointer; background:transparent;
        border:0; padding:0;}
  .zone.prev{left:0;}  .zone.next{right:0;}
  .zone:disabled{cursor:default;}

  .bar{
    position:relative; z-index:1; margin-top:22px;
    display:flex; align-items:center; gap:16px; font-size:12px; color:var(--dim);
    letter-spacing:.05em;
  }
  .bar button{
    background:transparent; border:1px solid rgba(232,228,219,.22); color:var(--ink);
    border-radius:99px; width:34px; height:34px; cursor:pointer; font-size:14px;
    font-family:inherit; transition:border-color .2s, background .2s;
  }
  .bar button:hover:not(:disabled){border-color:rgba(232,228,219,.6); background:rgba(255,255,255,.05);}
  .bar button:disabled{opacity:.25; cursor:default;}
  .count{min-width:104px; text-align:center; font-variant-numeric:tabular-nums;}

  @media (max-width:760px){
    .stage{width:96vw;}
    .bar{font-size:11px; gap:12px;}
  }
  @media (prefers-reduced-motion:reduce){
    .leaf,.book{transition-duration:.01ms;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="book" id="book">
    <div class="block"></div>
  </div>
  <button class="zone prev" id="prev" aria-label="Previous page"></button>
  <button class="zone next" id="next" aria-label="Next page"></button>
</div>

<div class="bar">
  <button id="bprev" aria-label="Previous page">&#8249;</button>
  <span class="count" id="count"></span>
  <button id="bnext" aria-label="Next page">&#8250;</button>
</div>

<script>
/* Leaf 0 is the cover, leaves 1–20 are the 40 interior pages in order, and
   the last leaf is the back cover. Pairing works out to the printed book:
   after the cover turns, page 2 faces page 3, page 4 faces page 5, and so on. */
const DIR = '/books/climbing-machine/read/';
const PAGES = 40;

const leaves = [];
leaves.push({ front: DIR + 'cover-front.jpg', back: null, label: 'Cover' });
for (let i = 1; i <= PAGES; i += 2) {
  leaves.push({ front: DIR + pad(i), back: DIR + pad(i + 1), label: null, n: i });
}
leaves.push({ front: null, back: DIR + 'cover-back.jpg', label: 'Back cover' });

function pad(n){ return 'p' + String(n).padStart(2,'0') + '.jpg'; }

const book = document.getElementById('book');
const els = leaves.map((L, i) => {
  const el = document.createElement('div');
  el.className = 'leaf';
  el.innerHTML =
    `<div class="face front">${L.front ? `<img src="${L.front}" alt="" ${i>1?'loading="lazy"':''}>` : ''}</div>` +
    `<div class="face back">${L.back ? `<img src="${L.back}" alt="" loading="lazy">` : ''}</div>`;
  book.appendChild(el);
  return el;
});

let at = 0;                       // how many leaves have been turned
const last = leaves.length;

function paint(){
  els.forEach((el, i) => {
    const turned = i < at;
    el.classList.toggle('flipped', turned);
    // Turned leaves stack upward on the left; untouched ones stack downward
    // on the right, so the one you are about to turn is always on top.
    el.style.zIndex = turned ? i + 1 : last - i;
  });
  book.classList.toggle('open', at > 0 && at < last);

  const spread = at === 0 ? 'Cover'
    : at >= last ? 'Back cover'
    : (() => {
        // Sheet number ≠ printed folio: two blanks and the dedication come
        // first, so the number on the paper is the sheet minus two. Label by
        // what the reader can actually see printed at the foot of the page.
        const folio = n => (n >= 4 && n <= 39) ? n - 2 : null;
        const l = 2 * at - 2, r = 2 * at - 1;      // sheets now showing
        if (l >= PAGES) return 'End';
        const fl = folio(l), fr = folio(r);
        if (fl && fr) return `Pages ${fl}–${fr}`;
        if (fr) return `Page ${fr}`;
        if (fl) return `Page ${fl}`;
        return at === 2 ? 'Dedication' : 'Opening';
      })();
  document.getElementById('count').textContent = spread;
  for (const id of ['prev','bprev']) document.getElementById(id).disabled = at === 0;
  for (const id of ['next','bnext']) document.getElementById(id).disabled = at >= last;
}

function go(d){
  const next = Math.min(last, Math.max(0, at + d));
  if (next === at) return;
  at = next;
  paint();
}

['next','bnext'].forEach(id => document.getElementById(id).addEventListener('click', () => go(1)));
['prev','bprev'].forEach(id => document.getElementById(id).addEventListener('click', () => go(-1)));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  if (e.key === 'Home') go(-last);
  if (e.key === 'End') go(last);
});

// swipe
let x0 = null;
document.addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 45) go(dx < 0 ? 1 : -1);
  x0 = null;
}, {passive:true});

paint();
</script>
</body>
</html>
