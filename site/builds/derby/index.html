      <div class="card" style="text-align:center;">
        <div class="tiny">${pb ? 'Personal best' : 'Race complete'} · ${classNow().name}</div>
        <div class="big" style="color:${pb?'var(--acc)':'var(--fg)'}">${fmtClock(finished.ms)}</div>
        <div class="muted">${finished.correct} clean · ${finished.missed} missed · ${fmt(finished.medianMs)} median</div>
        ${g ? `<div class="muted" style="margin-top:8px;">
          ${delta > 0 ? `<span style="color:var(--acc)">${fmtClock(delta)} faster</span> than last time`
                      : delta < 0 ? `${fmtClock(-delta)} slower than last time`
                      : 'dead heat with last time'}</div>` : ''}
      </div>
      ${bandCard(finished)}
      <div class="card">
        <div class="sechead" style="margin-top:0;"><h2>Where you stand</h2><div class="line"></div></div>
        ${masteryBlock()}
      </div>
      <p style="text-align:center;"><button class="btn btn-p" id="again" type="button">Race again</button></p>`;
    document.getElementById('again').addEventListener('click', startRace);
    return;
  }

  if (!R){
    const g = lastRun(), b = bestRun();
    B.innerHTML = `
      <div class="card">
        <p style="margin:0 0 4px;font-size:16px;font-weight:700;">${trackLen()} facts. One furlong each.</p>
        <p class="muted" style="margin:0 0 14px;">Type the answer and hit go. Nothing is awarded for being
           right &mdash; the horse moves because you answered, and how fast it moves is how fast you recalled.</p>
        <div class="row" style="margin-bottom:14px;">
          <div><div class="tiny">CLASS</div><div class="big" style="font-size:24px;">${classNow().name}</div>
            <div class="tiny">${classNow().next ? classNow().toGo + ' to ' + classNow().next.name : 'the whole book'}</div></div>
          <div><div class="tiny">MASTERED</div><div class="big">${countState('mastered')}<span class="muted" style="font-size:15px;">/${activeFacts().length}</span></div></div>
          ${g ? `<div><div class="tiny">LAST RUN</div><div class="big">${fmtClock(g.ms)}</div></div>` : ''}
          ${b ? `<div><div class="tiny">BEST</div><div class="big" style="color:var(--best)">${fmtClock(b.ms)}</div></div>` : ''}
        </div>
        <div class="sechead"><h2>What are you training?</h2><div class="line"></div></div>
        <div class="chips" style="margin-bottom:12px;">
          ${SETS.map(x => `<button class="chip${PREFS.set===x.key?' on':''}" data-set="${x.key}" type="button"
              aria-pressed="${PREFS.set===x.key}">${x.name}</button>`).join('')}
        </div>
        <p class="tiny" style="margin:-4px 0 12px;">${setDef(PREFS.set).sub}</p>
        ${setOptions()}
        <div class="row" style="align-items:center;">
          <button class="btn btn-p" id="start" type="button" style="flex:none;">Go to post</button>
          <button class="btn" id="snd" type="button" style="flex:none;" aria-pressed="${soundOn}">${soundOn ? '🔊 Sound on' : '🔇 Sound off'}</button>
        </div>
      </div>
      ${g ? `<p class="tiny" style="text-align:center;">Your last run rides as a ghost. The two grey horses hold
        a steady 3.0s and 2.0s a fact &mdash; pace-setters, not prizes.</p>` : ''}`;
    const redraw = () => { savePrefs(); renderRace(); };
    B.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => {
      PREFS.set = b.dataset.set; redraw();
    }));
    B.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => {
      const t = +b.dataset.t;
      const i = PREFS.tables.indexOf(t);
      if (i >= 0) PREFS.tables.splice(i,1); else PREFS.tables.push(t);
      if (!PREFS.tables.length) PREFS.tables = [t];      // never train nothing
      redraw();
    }));
    const on = (id, fn) => { const e = document.getElementById(id); if (e) e.addEventListener('click', fn); };
    on('allT',  () => { PREFS.tables = Array.from({length:MAXT}, (_,i) => i+1); redraw(); });
    on('noneT', () => { PREFS.tables = [7]; redraw(); });
    on('cMiss', () => { PREFS.missing  = !PREFS.missing;  redraw(); });
    on('cDiv',  () => { PREFS.division = !PREFS.division; redraw(); });
    on('sqRoot',() => { PREFS.sq.root  = !PREFS.sq.root;  redraw(); });
    on('cuRoot',() => { PREFS.cu.root  = !PREFS.cu.root;  redraw(); });
    B.querySelectorAll('[data-max]').forEach(b => b.addEventListener('click', () => {
      const v = +b.dataset.max;
      if (PREFS.set === 'squares') PREFS.sq.max = v;
      else if (PREFS.set === 'cubes') PREFS.cu.max = v;
      else PREFS.pr.max = v;
      redraw();
    }));
    document.getElementById('start').addEventListener('click', startRace);
    document.getElementById('snd').addEventListener('click', e => {
      setSound(!soundOn); e.currentTarget.textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off';
      e.currentTarget.setAttribute('aria-pressed', String(soundOn));
    });
    return;
  }

  const missing = R.phase === 'miss';
  B.innerHTML = `
    <div class="track" id="trackWrap"><canvas id="trackCvs" data-h="196" data-auto="1"
        role="img" aria-label="A horse race. Your horse advances one furlong for each fact you answer."></canvas>
      ${missing ? '' : `<div class="over">
        <div class="fact">${esc(R.ask.text)}${R.ask.eq ? ' <span style="opacity:.5">=</span> ?' : ''}</div>
        <div><span class="entry" id="entryEl">${esc(R.entry) || '&nbsp;'}</span></div>
      </div>`}</div>
    <p class="sr-only" id="liveSay" aria-live="polite"></p>
    ${missing ? `
      <div class="miss">
        <div class="head">✗ ${esc(R.missAsk.text)}</div>
        <div class="truth">${R.missFact.kind === 'bool'
          ? R.missFact.n + ' is ' + (R.missFact.ans ? 'prime' : 'not prime')
          : R.missFact.q + ' = ' + R.missFact.ans}</div>
        <div class="why">${esc(hintFor(R.missFact))}</div>
        <div class="again">now type it</div>
        <div style="text-align:center;"><span class="entry" id="entryEl">${esc(R.entry) || '&nbsp;'}</span></div>
      </div>`
    : ``}
    ${(missing ? R.missAsk : R.ask).bool ? `
    <div class="pad pad2">
      <button class="key go" data-k="yes" type="button">Prime</button>
      <button class="key no" data-k="no" type="button">Not prime</button>
    </div>` : `
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-k="${n}" type="button">${n}</button>`).join('')}
      <button class="key del" data-k="del" type="button" aria-label="Delete">⌫</button>
      <button class="key" data-k="0" type="button">0</button>
      <button class="key go" data-k="go" type="button" aria-label="Submit">✓</button>
    </div>`}
    <p class="tiny" style="text-align:center;margin-top:10px;">${R.i} of ${R.len} · ${R.missed} missed</p>`;
  B.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => key(b.dataset.k)));
  initTrack(); paintTrack();
  if (R && !prefersStill()){
    const wrap = document.getElementById('trackWrap');
    if (wrap && R.kick && performance.now() - R.kick < 200){
      wrap.classList.remove('surge'); void wrap.offsetWidth; wrap.classList.add('surge');
    }
    if (wrap && R.stumbleAt && performance.now() - R.stumbleAt < 200){
      wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake');
    }
  }
}

/* ── mastery, made visible: this is where the motivation is supposed to come
      from, so it is not a stats page tucked away ─────────────────────── */
const LEGEND = `<div class="legend">
    <span><i style="background:var(--acc)"></i>mastered</span>
    <span><i style="background:#2f4a36"></i>on its way</span>
    <span><i style="background:#3a3320"></i>being learned</span>
    <span><i style="background:#1b1b1b;border:1px solid #2a2a2a"></i>not met yet</span>
  </div>`;

/* The board for whichever set you are on. The tables get their axes back — a
   13×13 field of squares with nothing down the side or across the top is not
   readable, which is the whole complaint. Squares and cubes are short enough to
   label every cell; primes is the 2–100 number square. */
function boardFor(){
  const cell = (id, label, title, extra) =>
    `<div class="cell ${stateOf(id)}${extra||''}" title="${title}">${label ? `<span class="cn">${label}</span>` : ''}</div>`;
  if (PREFS.set === 'mult'){
    const on = new Set(PREFS.tables);
    const out = ['<div class="hd"></div>'];
    for (let b = 1; b <= MAXT; b++) out.push(`<div class="hd">${b}</div>`);
    for (let a = 1; a <= MAXT; a++){
      out.push(`<div class="hd">${a}</div>`);
      for (let b = 1; b <= MAXT; b++){
        const live = on.has(a) || on.has(b);
        out.push(`<div class="cell ${live ? stateOf(a+'x'+b) : ''}" title="${a}×${b} — ${live ? stateOf(a+'x'+b) : 'not selected'}"
          style="${live ? '' : 'opacity:.28'}"></div>`);
      }
    }
    return `<div class="board" style="grid-template-columns:repeat(${MAXT+1},1fr);">${out.join('')}</div>
      <p class="tiny" style="margin:6px 0 0;">Rows and columns are the two numbers &mdash; the square where row 7
         meets column 8 is 7&thinsp;&times;&thinsp;8. Both 7&thinsp;&times;&thinsp;8 and 8&thinsp;&times;&thinsp;7 are
         there, because they're different cues. Faded means you've switched that table off.</p>`;
  }
  if (PREFS.set === 'squares' || PREFS.set === 'cubes'){
    const sup = PREFS.set === 'squares' ? '²' : '³';
    const max = PREFS.set === 'squares' ? PREFS.sq.max : PREFS.cu.max;
    const F = setFacts();
    return `<div class="board" style="grid-template-columns:repeat(auto-fill,minmax(46px,1fr));">
      ${F.map(f => `<div class="cell ${f.n <= max ? stateOf(f.id) : ''}" title="${f.q} = ${f.ans}"
          style="aspect-ratio:1.5;${f.n <= max ? '' : 'opacity:.28'}"><span class="cn"
          style="font-size:12px;">${f.n}${sup}</span></div>`).join('')}
    </div>
    <p class="tiny" style="margin:6px 0 0;">One square per fact, ${F[0].n}${sup} to ${F[F.length-1].n}${sup}.
       Faded means it's above the ceiling you set.</p>`;
  }
  // primes: the number square, 2 to 100
  const max = PREFS.pr.max, out = [];
  for (let n = 1; n <= PR_MAX; n++){
    if (n === 1){ out.push(`<div class="cell" style="opacity:.18" title="1 is neither"><span class="cn">1</span></div>`); continue; }
    const f = FACT['pr'+n], live = n <= max;
    /* The answer key is the WEIGHT of the number, not an outline. A green
       outline round a green "mastered" cell is invisible, which is exactly the
       cells you most want to read. Bold works on all four fills. */
    out.push(`<div class="cell ${live ? stateOf(f.id) : ''}" title="${n} — ${f.ans ? 'prime' : 'not prime'}, ${live ? stateOf(f.id) : 'above your ceiling'}"
      style="${live ? '' : 'opacity:.28'}"><span class="cn ${f.ans ? 'yes' : 'no'}">${n}</span></div>`);
  }
  return `<div class="board" style="grid-template-columns:repeat(10,1fr);">${out.join('')}</div>
    <p class="tiny" style="margin:6px 0 0;"><b>The numbers 1 to 100, ten to a row.</b> A number in
       <b style="color:#fff">bold</b> <i>is</i> prime &mdash; that's the answer key. The fill behind it is your
       progress, and it's the same four colours everywhere else on this page.</p>`;
}

function masteryBlock(){
  const m = countState('mastered'), r = countState('review'), l = countState('learning');
  const n = activeFacts().length;
  return `${boardFor()}${LEGEND}
    <p class="tiny" style="margin-top:8px;">${m} mastered · ${r} on their way · ${l} being learned · ${n-m-r-l} not met yet</p>
    <p class="tiny" style="margin-top:4px;">Mastered facts never leave the deck. They come back rarely, oldest first, because that is what keeps them.</p>`;
}

/* ── charts: small, labelled, and dependency-free ─────────────────────── */
function chart(runs, pick, opts){
  const W = 320, H = 96, L = 26, Rr = 6, T = 6, B = 16;
  const vals = runs.map(pick);
  if (vals.length < 2) return `<p class="tiny">Two races and this draws.</p>`;
  const lo = opts.lo != null ? opts.lo : Math.min(...vals) * 0.9;
  const hi = opts.hi != null ? opts.hi : Math.max(...vals) * 1.1;
  const x = i => L + i / (vals.length - 1) * (W - L - Rr);
  const y = v => T + (1 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * (H - T - B);
  const band = opts.band
    ? `<rect x="${L}" y="${y(opts.band[1]).toFixed(1)}" width="${W-L-Rr}"
         height="${(y(opts.band[0]) - y(opts.band[1])).toFixed(1)}" fill="rgba(74,222,128,.14)"/>`
    : '';
  const d = vals.map((v,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const dots = vals.map((v,i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2"
      fill="${opts.dot ? opts.dot(v) : opts.stroke}"/>`).join('');
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      role="img" aria-label="${opts.alt}">
    ${band}
    <line x1="${L}" y1="${H-B}" x2="${W-Rr}" y2="${H-B}" stroke="#2a2a2a" stroke-width="1"/>
    <path d="${d}" fill="none" stroke="${opts.stroke}" stroke-width="1.6"
      vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    ${dots}
    <text x="0" y="${T+6}" fill="#8b8b8b" font-size="8" font-family="ui-monospace,monospace">${opts.top}</text>
    <text x="0" y="${H-B}" fill="#8b8b8b" font-size="8" font-family="ui-monospace,monospace">${opts.bottom}</text>
    <text x="${L}" y="${H-4}" fill="#8b8b8b" font-size="8" font-family="ui-monospace,monospace">oldest</text>
    <text x="${W-Rr}" y="${H-4}" fill="#8b8b8b" font-size="8" text-anchor="end" font-family="ui-monospace,monospace">latest</text>
  </svg></div>`;
}

function renderForm(){
  const F = document.getElementById('formBody');
  const A = activeFacts();
  const inPlay = A.filter(f => { const s = stateOf(f.id); return s === 'learning' || s === 'review'; })
    .map(f => ({ f, r: rec(f.id) }))
    .sort((x,y) => y.r.miss - x.r.miss || qualifying(x.r).length - qualifying(y.r).length)
    .slice(0, 14);
  const dotStrip = (r, f) => {
    const need = masterHits(f), q = qualifying(r), days = [...daysOf(r)].sort();
    let out = '';
    for (let i = 0; i < need; i++)
      out += `<span class="${i < Math.min(q.length, days.length) ? 'dot-on' : 'dot-off'}">●</span>`;
    return `<span class="dots">${out}</span>`;
  };
  const mine = setRuns();
  const runs = mine.slice(-20);
  const recent = mine.slice().reverse().slice(0, 10);
  const cls = classNow();

  F.innerHTML = `
    <div class="card">
      <div class="sechead" style="margin-top:0;"><h2>Across every set</h2><div class="line"></div></div>
      <div class="setrow">
        ${SETS.map(x => {
          const facts = ALL[x.key];
          const done = facts.filter(f => stateOf(f.id) === 'mastered').length;
          const here = x.key === PREFS.set;
          return `<div style="${here ? 'border-color:var(--acc)' : ''}">
            <div class="tiny">${x.name}${here ? ' · racing' : ''}</div>
            <div class="n" style="${here ? 'color:var(--acc)' : ''}">${done}<span class="muted"
              style="font-size:13px;font-weight:400;">/${facts.length}</span></div>
            <div class="tiny">mastered</div></div>`;
        }).join('')}
      </div>
      <div class="chips" style="margin:12px 0 0;">
        ${SETS.map(x => `<button class="chip${PREFS.set===x.key?' on':''}" data-fset="${x.key}"
          type="button" aria-pressed="${PREFS.set===x.key}">${x.name}</button>`).join('')}
      </div>
      <p class="tiny" style="margin:8px 0 0;">Everything below is the set you've picked. You're in
         <b style="color:var(--acc)">${cls.name}</b>${cls.next ? ` — ${cls.toGo} more to ${cls.next.name}` : ' — the whole set'}.</p>
    </div>

    <div class="card">
      <div class="sechead" style="margin-top:0;"><h2>Every fact in ${setDef(PREFS.set).name.toLowerCase()}</h2><div class="line"></div></div>
      ${masteryBlock()}
    </div>

    ${runs.length > 1 ? `<div class="card">
      <div class="sechead" style="margin-top:0;"><h2>How hard it's been</h2><div class="line"></div></div>
      ${chart(runs, r => (r.correct+r.missed) ? r.correct/(r.correct+r.missed) : 0,
        { lo:0.4, hi:1, band:[0.77,0.93], stroke:'#9aa1ac', top:'100%', bottom:'40%',
          alt:'Your accuracy in each race, against the shaded 77 to 93 per cent band',
          dot: v => (v>=0.77&&v<=0.93) ? '#4ade80' : v>0.93 ? '#a78bfa' : '#fbbf24' })}
      <p class="tiny" style="margin:8px 0 0;">One point per race. The green stripe is the band it steers you
         toward — <span style="color:#fbbf24">below</span> it, it eases off; <span style="color:#a78bfa">above</span>
         it, it reaches for harder facts.</p>
    </div>` : ''}

    ${runs.length > 1 ? `<div class="card">
      <div class="sechead" style="margin-top:0;"><h2>How fast you're recalling</h2><div class="line"></div></div>
      ${chart(runs, r => r.medianMs || 0, { lo:0, stroke:'var(--acc)',
        top:'slower', bottom:'0s', alt:'Your median answer time in each race, oldest to latest' })}
      <p class="tiny" style="margin:8px 0 0;">Median time to answer, race by race. Down is the whole point:
         a fact you compute is not a fact you know, and the bar is ${FLUENT_MS/1000}s.</p>
    </div>` : ''}

    ${inPlay.length ? `<div class="card">
      <div class="sechead" style="margin-top:0;"><h2>What you're working on</h2><div class="line"></div></div>
      <table><thead><tr><th>Fact</th><th>Days</th><th>Best</th><th>Missed</th></tr></thead><tbody>
      ${inPlay.map(({f,r}) => {
        const q = qualifying(r);
        return `<tr><td>${f.q}</td><td>${dotStrip(r,f)}</td>
          <td>${q.length ? fmt(Math.min(...q.map(h=>h.ms))) : '—'}</td><td>${r.miss||''}</td></tr>`;
      }).join('')}
      </tbody></table>
      <p class="tiny" style="margin-top:10px;">A dot is one unaided answer under ${FLUENT_MS/1000}s, on a different day.
         Fill the dots and the fact counts as mastered — day-spacing is the part that makes it hold.
         It still comes back after that, just rarely.</p>
    </div>` : `<div class="card"><p class="muted" style="margin:0;">Run a race in this set and it fills in.</p></div>`}

    ${recent.length ? `<div class="card">
      <div class="sechead" style="margin-top:0;"><h2>Past runs</h2><div class="line"></div></div>
      <table><thead><tr><th>When</th><th>Time</th><th>Median</th><th>Right</th></tr></thead><tbody>
      ${recent.map(r => { const t = r.correct + r.missed;
        return `<tr><td>${new Date(r.ts).toLocaleDateString([], {month:'short', day:'numeric'})}</td>
        <td>${fmtClock(r.ms)}</td><td>${fmt(r.medianMs)}</td>
        <td>${t ? Math.round(r.correct/t*100) + '%' : '—'}</td></tr>`; }).join('')}
      </tbody></table>
    </div>` : ''}
    <p style="text-align:center;"><button class="btn" id="wipe" type="button" style="color:#f87171;border-color:#7f1d1d;">Erase everything</button></p>`;

  F.querySelectorAll('[data-fset]').forEach(b => b.addEventListener('click', () => {
    PREFS.set = b.dataset.fset; savePrefs(); renderForm();
  }));
  const w = document.getElementById('wipe');
  if (w) w.addEventListener('click', () => {
    if (!confirm('Erase every fact record and every run, in every set? This cannot be undone.')) return;
    Object.values(LS).forEach(k => localStorage.removeItem(k));
    RECS = {}; RUNS = []; renderForm();
  });
}

function renderMethod(){
  document.getElementById('methodBody').innerHTML = `
    <div class="card">
      <div class="sechead" style="margin-top:0;"><h2>Why it works this way</h2><div class="line"></div></div>
      <p class="muted">Four decisions, each from something that has actually replicated.</p>
      <p style="font-size:14px;"><b style="color:var(--acc)">Nothing is awarded for a correct answer.</b>
         Points and prizes don't build durable motivation and can crowd out the real kind. The horse moves
         because you answered; its speed is your recall rate. You're racing your own fluency from last time,
         which is the only scoreboard that means anything.</p>
      <p style="font-size:14px;"><b style="color:var(--acc)">Speed is the measurement, not correctness.</b>
         Getting ${'7 × 8'} right after four seconds means you computed it. Fluency is retrieval, so an answer
         over ${FLUENT_MS/1000}s doesn't count toward mastery however right it is.</p>
      <p style="font-size:14px;"><b style="color:var(--acc)">Nothing ever retires.</b>
         A mastered fact stays in the deck for good &mdash; it just comes back rarely, and the one you get
         is whichever has gone longest without a look. Retiring a fact the moment you know it is how you
         forget it six months later; the whole point of spacing is that it keeps working after you stop
         needing it.</p>
      <p style="font-size:14px;"><b style="color:var(--acc)">Three days, not three tries.</b>
         A fact needs ${MASTER_HITS} unaided answers under the bar on ${MASTER_DAYS} different days. Three in one
         sitting is cramming and it decays; the gap between days is what makes it hold.</p>
      <p style="font-size:14px;"><b style="color:var(--acc)">A miss makes you produce it, not read it.</b>
         Reading the answer is recognition, and recognition isn't mastery. So the horse stops, you get the fact
         and a way to rebuild it, and you type it before racing on. It comes back five furlongs later in the
         same race.</p>
      <p style="font-size:14px;"><b style="color:var(--acc)">It steers to keep you near ${Math.round(BAND*100)}%.</b>
         Learning is fastest when you're missing about one in six &mdash; not when it's easy, not when it's crushing.
         So every draw aims at a fact you've got roughly a ${Math.round(P_AIM*100)}% chance of landing, and that aim
         moves with you: clear nearly everything and it reaches for harder facts and asks more of them backwards;
         drop below the band and it stops introducing anything new, asks the plain <span
         style="font-variant-numeric:tabular-nums;">a &times; b</span> form, and draws facts you're likely to get
         until you're back up. You can see where you landed after every race.</p>
      <p style="font-size:14px;"><b style="color:var(--acc)">It won't drill your worst fact.</b>
         Tempting, and wrong. Time spent on what's still out of reach buys almost nothing &mdash; Nelson and
         Leonesio called it labour in vain &mdash; and so does time on what you already have. The value is at the
         edge, which is what it aims at. A fact that's genuinely gone doesn't get drilled harder; it gets the
         stumble, the strategy line, and a retype.</p>
      <p style="font-size:14px;"><b style="color:var(--acc)">Four sets, one method.</b>
         Times tables, squares, cubes and primes. They share the gate, the spacing and the band; what changes is
         the question. Primes is the odd one &mdash; it's a yes/no call rather than a number, so it gets two
         buttons instead of a keypad, needs ${MASTER_HITS+1} clean answers rather than ${MASTER_HITS} because a
         guess pays half the time, and its floor is 50% not 0. Cubes runs a shorter track: forty draws over
         twelve facts is three passes at each inside one sitting, which is the massing the day-spacing exists to
         avoid.</p>
      <p class="tiny" style="margin-top:14px;">On the 85%: that's Wilson, Shenhav, Straccia &amp; Cohen (2019),
         who derived an optimal training <i>error</i> rate of 15.87% &mdash; for binary classification under
         gradient descent, not as a law about people. It's often filed under Vygotsky's zone of proximal
         development, which is a different claim (that one is about what you can do <i>with help</i>). The
         framework that actually fits choosing flashcards is Metcalfe and Kornell's Region of Proximal Learning:
         study at the edge of what you know.</p>
      <p class="tiny" style="margin-top:14px;">Built on the same method as the
         <a href="/builds/ccat-trainer/" style="color:var(--acc)">CCAT trainer</a>'s flashcards, with the two
         things that one gets wrong fixed: answers here are typed rather than self-graded, and a fact you
         miss comes back in the same session.</p>
    </div>`;
}

/* dependency-free confetti, lifted from the CCAT trainer — fires ONLY on a
   personal best, never on a correct answer */
function confetti(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cvs = document.createElement('canvas');
  cvs.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999';
  cvs.width = innerWidth; cvs.height = innerHeight;
  document.body.appendChild(cvs);
  const c = cvs.getContext('2d'), N = 110, P = [];
  for (let i = 0; i < N; i++) P.push({x:Math.random()*cvs.width, y:-20-Math.random()*cvs.height*0.4,
    vx:(Math.random()-0.5)*2, vy:1+Math.random()*2.4, s:4+Math.random()*5,
    r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.2,
    col:['#4ade80','#a78bfa','#facc15','#eaeaea'][i%4]});
  const t0 = performance.now();
  (function step(now){
    const el = now - t0;
    c.clearRect(0,0,cvs.width,cvs.height);
    c.globalAlpha = Math.max(0, 1 - el/2800);
    P.forEach(p => { p.vy += 0.05; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.fillStyle = p.col;
      c.fillRect(-p.s/2,-p.s/2,p.s,p.s); c.restore(); });
    if (el < 2800) requestAnimationFrame(step); else cvs.remove();
  })(t0);
}

/* physical keyboard, for anyone at a desk */
document.addEventListener('keydown', e => {
  if (currentTab !== 'race' || !R) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[0-9]$/.test(e.key)){ e.preventDefault(); key(e.key); }
  else if (e.key === 'Enter'){ e.preventDefault(); key('go'); }
  else if (e.key === 'Backspace'){ e.preventDefault(); key('del'); }
});

renderRace();
</script>
