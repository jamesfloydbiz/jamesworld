<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCAT Trainer</title>
<meta name="description" content="Practice + spaced-repetition trainer for the CCAT cognitive aptitude test. Exam mode (50Q/15min), adaptive practice with Leitner, and flashcards with SM-2-lite. All state in localStorage.">
<link rel="canonical" href="https://jamesfloyds.world/builds/ccat-trainer/">
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg:#0a0a0a; --fg:#eaeaea; --dim:#888; --card:#151515; --border:#252525; --acc:#4ade80; --bad:#f87171; --warn:#facc15; }
  html,body{background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;}
  body{margin:0;min-height:100vh;min-height:100dvh;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;}
  .btn{border:1px solid var(--border);background:#111;color:var(--fg);border-radius:6px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:14px;transition:all .15s;}
  .btn:hover{background:#1c1c1c;border-color:#3a3a3a;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-p{background:var(--fg);color:#0a0a0a;border-color:var(--fg);}
  .btn-p:hover{background:#fff;border-color:#fff;}
  .opt{display:block;width:100%;text-align:left;padding:14px 18px;background:#111;border:1px solid var(--border);border-radius:8px;color:var(--fg);cursor:pointer;transition:all .15s;font-family:inherit;font-size:15px;}
  .opt:hover:not(:disabled){background:#1c1c1c;border-color:#444;}
  .opt.ok{background:rgba(74,222,128,.12);border-color:var(--acc);}
  .opt.no{background:rgba(248,113,113,.12);border-color:var(--bad);}
  .opt:disabled{cursor:default;}
  .kbd{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--border);border-radius:3px;color:var(--dim);}
  .tab{padding:8px 10px;border:none;background:transparent;color:var(--dim);cursor:pointer;font-family:inherit;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.on{color:var(--fg);border-bottom-color:var(--fg);}
  .tab:hover{color:var(--fg);}
  .pill{display:inline-block;padding:2px 8px;font-size:11px;border-radius:99px;background:#1a1a1a;border:1px solid var(--border);color:var(--dim);}
  .bar{height:6px;background:#1a1a1a;border-radius:99px;overflow:hidden;}
  .bar > div{height:100%;background:var(--acc);transition:width .3s;}
  .mono{font-family:ui-monospace,Menlo,monospace;}
  input[type=number],select{background:#111;color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-family:inherit;}
  .flash{display:none;padding:12px 16px;background:rgba(250,204,21,.1);border:1px solid var(--warn);border-radius:6px;color:var(--warn);margin-bottom:16px;}
  .flash.on{display:block;}
</style>
</head>
<body>

<div class="max-w-4xl mx-auto px-4 py-6 md:py-10">

  <!-- Header -->
  <header class="mb-6 flex items-start justify-between gap-4 flex-wrap">
    <div>
      <a href="/builds/" class="text-xs text-gray-500 hover:text-white">← Builds</a>
      <h1 class="text-2xl md:text-3xl font-bold mt-1">CCAT Trainer</h1>
      <p class="text-xs text-gray-500 mt-1">50Q / 15 min · adaptive drill · spaced repetition · all local</p>
    </div>
    <div class="text-right text-xs text-gray-500">
      <div id="pom-clock" class="mono text-lg text-white"></div>
      <div id="pom-status">Idle</div>
      <button id="pom-toggle" class="btn mt-2 text-xs">Start Pomodoro</button>
    </div>
  </header>

  <noscript>
    <p style="border-left:2px solid #333;padding:0.25rem 0 0.25rem 1rem;margin:1rem 0;color:#bbb;line-height:1.6;font-family:Georgia,serif;">
      The CCAT Trainer is an interactive practice app — timed drills, flashcards, and stats, all stored locally in your browser. It needs JavaScript to run; there is no static version.
    </p>
  </noscript>

  <!-- Tabs -->
  <nav class="flex flex-wrap gap-2 border-b border-neutral-800 mb-6">
    <button class="tab on" data-tab="intro">Start here</button>
    <button class="tab" data-tab="practice">Practice</button>
    <button class="tab" data-tab="exam">Exam</button>
    <button class="tab" data-tab="learning">Learning</button>
    <button class="tab" data-tab="stats">Stats</button>
  </nav>

  <!-- Views -->
  <main id="views"></main>

</div>

<!-- Tab-blur warning modal (exam mode) -->
<div id="blur-modal" style="display:none;" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
  <div class="card p-6 max-w-md text-center">
    <div class="text-4xl mb-2">⚠️</div>
    <h3 class="text-lg font-bold mb-2">Focus warning</h3>
    <p class="text-sm text-gray-400 mb-4">On the real CCAT, switching tabs auto-DQs you. This is a warning only.</p>
    <button class="btn btn-p" onclick="document.getElementById('blur-modal').style.display='none'">Back to the test</button>
  </div>
</div>

<script>
// ==================== DATA / STATE ====================
const CATS = ["Verbal","Numerical","Logic","Spatial"];
const WEIGHTS = {Verbal:.34, Numerical:.34, Spatial:.22, Logic:.10};
const EXAM_LEN = 50, EXAM_TIME = 15*60, PASS = 35;
const LS = {
  itemStats: "ccat.stats.v1",        // {id: {seen, correct, box, lastSession}}
  history:   "ccat.history.v1",      // [{ts, score, total, dur, catAcc}]
  cards:     "ccat.cards.v1",        // {cardId: {ease, iv, due}}
  subStats:  "ccat.substats.v1",     // {"Cat/sub": {att, ok, recent:[1,0,…]}}
  recent:    "ccat.recent.v1",       // [1,0,…] last N practice/exam outcomes (current form)
  progress:  "ccat.progress.v1",     // {"YYYY-MM-DD": {answered, life, form, mastered, bestExam}}
  settings:  "ccat.settings.v1",
  session:   "ccat.session.v1",
};
function ls(k, d){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }

let QUESTIONS = [], STATS = ls(LS.itemStats,{}), HIST = ls(LS.history,[]), CARDS = ls(LS.cards,{});
let SUBSTAT = ls(LS.subStats,{});
let RECENT = ls(LS.recent,[]);        // rolling window of the last answers (0/1)
let PROGRESS = ls(LS.progress,{});    // one snapshot per calendar day
const FORM_WIN = 40;                  // "current form" = accuracy over last 40 answers
let SETTINGS = ls(LS.settings,{pomLen:25, pomBreak:5, deepSet:false, confidence:false, sessionCount:0});

// ==================== MASTERY MODEL ====================
// Mastery is measured PER SUBTYPE over a rolling window of recent attempts —
// not a lifetime average (which never recovers from an early cold streak).
// A subtype is "mastered" once you clear the accuracy criterion across a full
// window. Mastered subtypes get retired to a light maintenance trickle so
// practice time flows to whatever you haven't proven yet.
const MASTERY_WIN = 8;      // rolling window of recent attempts per subtype
const MASTERY_ACC = 0.85;   // criterion accuracy over the window to "master"
const MASTERY_MIN = 6;      // min attempts before mastery can be declared
// Bank-derived difficulty bounds — filled at boot from the actual questions so
// the ZPD band and adaptivity aren't clamped to a guessed ceiling.
let MIND = 1, MAXD = 3, QMAP = {}, ALLSUBS = [];
const clamp = (x,lo,hi)=>Math.max(lo,Math.min(hi,x));
const subKey = q => `${q.c}/${q.sub}`;

// ==================== FLASHCARD DECKS ====================
// Every deck has a `method` that TEACHES how to get the answer (so a card you
// don't know still builds the skill), and many cards add a `why` — the trick,
// derivation, or examples behind the bare answer.
const DECKS = [
  {name:"Squares (11–20)",
   method:"Build from 10²=100 with (10+n)² = 100 + 20n + n². 13² → 100+60+9 = 169. Numbers ending in 5: tens digit t → t·(t+1) then '25' (15² → 1·2=2 → 225).",
   cards:["11²=121","12²=144","13²=169","14²=196","15²=225","16²=256","17²=289","18²=324","19²=361","20²=400"].map(s=>{const [q,a]=s.split("=");return{q,a};})},
  {name:"Cubes (2–10)",
   method:"n³ = n × n². Use a square you already know: 7³ = 7×49 = 343; 4³ = 4×16 = 64.",
   cards:["2³=8","3³=27","4³=64","5³=125","6³=216","7³=343","8³=512","9³=729","10³=1000"].map(s=>{const [q,a]=s.split("=");return{q,a};})},
  {name:"Fraction ↔ Percent",
   method:"Divide top ÷ bottom to get the decimal, then move the point two places right for the percent. 3/8 → 3÷8 = 0.375 → 37.5%. Thirds and sixths repeat forever (1/3 = 0.333…).",
   cards:[
    {q:"1/2",a:"0.5 = 50%"},{q:"1/3",a:"≈0.333 = 33.3%"},{q:"2/3",a:"≈0.667 = 66.7%"},{q:"1/4",a:"0.25 = 25%"},
    {q:"3/4",a:"0.75 = 75%"},{q:"1/5",a:"0.2 = 20%"},{q:"2/5",a:"0.4 = 40%"},{q:"1/6",a:"≈0.167 = 16.7%"},
    {q:"1/8",a:"0.125 = 12.5%"},{q:"3/8",a:"0.375 = 37.5%"},{q:"5/8",a:"0.625 = 62.5%"},{q:"1/10",a:"0.1 = 10%"},{q:"1/12",a:"≈0.083 = 8.3%"}
  ]},
  {name:"Percent shortcuts",
   method:"Anchor everything on 10% (move the decimal one place left). Then halve it for 5%, double it for 20%, or add pieces for 15%. 1% = move two places.",
   cards:[
    {q:"10% of anything",a:"Move the decimal one place",why:"10% of 240 → 24. This is the anchor you build every other percent from."},
    {q:"5%",a:"Half of 10%",why:"Find 10% first, then halve. 5% of 240 → 24 → 12."},
    {q:"15%",a:"10% + 5%",why:"15% of 240 → 24 + 12 = 36. (This is the tip-jar trick.)"},
    {q:"20%",a:"Double 10%",why:"20% of 240 → 24 × 2 = 48."},
    {q:"25%",a:"÷4",why:"25% = one quarter. 25% of 240 → 240 ÷ 4 = 60."},
    {q:"50%",a:"÷2",why:"50% = half. 50% of 240 → 120."},
    {q:"1%",a:"Move decimal two places",why:"1% of 240 → 2.4. Build odd percents from 1% + 10% pieces."},
    {q:"X% of Y = Y% of X",a:"The two are always equal",why:"8% of 25 is hard, but 25% of 8 = 2 is easy — same answer. Flip it when one side is friendlier."}
  ]},
  {name:"Series families",
   method:"To name a sequence, look at the STEP between terms: same amount added = arithmetic; same amount multiplied = geometric; steps that grow = squares/triangular; each term = the last two added = Fibonacci.",
   cards:[
    {q:"Arithmetic",a:"+ constant each step",why:"2, 5, 8, 11 → +3 every time. Find the gap; it never changes."},
    {q:"Geometric",a:"× constant each step",why:"3, 6, 12, 24 → ×2 every time. If terms grow fast, test multiplying."},
    {q:"Squares",a:"1, 4, 9, 16, 25…",why:"Each term is n×n. Gaps between them grow by 2 (odd numbers)."},
    {q:"Cubes",a:"1, 8, 27, 64, 125…",why:"Each term is n×n×n. Grows very fast — a giveaway for cubes."},
    {q:"Fibonacci",a:"Each = sum of prior two",why:"1,1,2,3,5,8,13 → 5+8 = 13. If a term equals the two before it, it's Fibonacci."},
    {q:"Primes",a:"2, 3, 5, 7, 11, 13…",why:"Numbers with no divisors but 1 and themselves. Irregular gaps = check primes."},
    {q:"Triangular",a:"1, 3, 6, 10, 15, 21",why:"Add 1, then 2, then 3… Running total of the counting numbers."},
    {q:"Growing gaps",a:"+1, +2, +3, +4…",why:"The amount added increases each step. 2, 3, 5, 8, 12 → gaps 1,2,3,4."},
    {q:"Interleaved",a:"Two series shuffled together",why:"Look at every OTHER term. 1,10,2,20,3,30 is really 1,2,3 and 10,20,30."},
    {q:"Alternating +/−",a:"Sign flips each step",why:"The operation switches: +5, −3, +5, −3… Watch for a zig-zag."}
  ]},
  {name:"Core formulas",
   method:"Learn how the three quantities relate, then plug in the two you're given to solve for the third.",
   cards:[
    {q:"Distance",a:"= Rate × Time",why:"So Rate = Distance ÷ Time, and Time = Distance ÷ Rate. 180 mi in 3 h → 60 mph."},
    {q:"Average",a:"= Sum ÷ Count",why:"To find a missing value: multiply the average by the count to get the Sum, then subtract the ones you know."},
    {q:"% change",a:"= (New − Old) ÷ Old",why:"Always divide by the OLD value. 40 → 50 is (50−40)/40 = 25% up."},
    {q:"Ratio a:b of T",a:"Each part = T ÷ (a+b)",why:"Add the ratio numbers for total parts, divide, then multiply back. 120 in 2:3 → 120÷5=24 → 48 and 72."},
    {q:"Work-rate trap",a:"Rate stays constant",why:"5 machines make 5 widgets in 5 min → 1 machine makes 1 widget in 5 min → 100 machines make 100 in 5 min. The time doesn't change."}
  ]},
  {name:"Classic traps",
   method:"On these, the FIRST answer that pops into your head is the wrong one. Learn the catch once and you'll spot it under time pressure.",
   cards:[
    {q:"Bat + ball cost $1.10; bat is $1 more than ball. Ball?",a:"$0.05 (not $0.10)",why:"If the ball were $0.10 the bat would be $1.10 and the total $1.20. Ball $0.05 + bat $1.05 = $1.10. ✓"},
    {q:"5 machines make 5 widgets in 5 min. 100 machines make 100 widgets in?",a:"5 min",why:"Each machine makes 1 widget in 5 min no matter how many machines. Rate is constant."},
    {q:"Price goes +20% then −20%. Net?",a:"−4%",why:"1.20 × 0.80 = 0.96. The −20% acts on a bigger number, so you end up lower."},
    {q:"'Some flowers fade' + 'all roses are flowers' → about roses?",a:"No valid conclusion",why:"The roses might be the flowers that DON'T fade. 'Some' tells you nothing about roses specifically."},
    {q:"Modus tollens: if P→Q and NOT Q, then?",a:"NOT P",why:"If rain → wet ground, and the ground is NOT wet, then it did NOT rain."}
  ]},
  {name:"Word roots",
   method:"A root carries its meaning into every word it appears in. Memorize the root + a couple of example words, then you can decode words you've never seen on the test.",
   cards:[
    {q:"bene-",a:"good / well",why:"BENEfit, BENEvolent, BENEficial — all positive. It's the opposite of mal-. So 'benevolent leader' = a good-hearted one."},
    {q:"mal-",a:"bad / evil",why:"MALfunction, MALice, MALady, disMAL — all bad. So 'malevolent' = wishing bad on someone."},
    {q:"circum-",a:"around",why:"Think circle. CIRCUMference (around the edge), CIRCUMnavigate (sail around), CIRCUMvent (get around a rule)."},
    {q:"-vert / -verse",a:"turn",why:"From Latin 'to turn'. reVERSE (turn back), inVERT (turn upside down), conVERT (turn into), diVERT (turn aside)."},
    {q:"loqu- / loc-",a:"speak",why:"eLOQUent (speaks well), LOQUacious (talks a lot), ventriLOQUist (throws their voice), elocution (speech)."},
    {q:"magn-",a:"great / large",why:"MAGNify (make bigger), MAGNitude (size), MAGNificent (grand), magnate (a big-shot businessperson)."},
    {q:"ambi- / amphi-",a:"both",why:"AMBIdextrous (both hands), AMBIguous (both meanings at once), AMPHIbian (lives both on land and in water)."},
    {q:"pac-",a:"peace",why:"From Latin 'pax'. PACify (calm down), PACifist (anti-war), the PACific Ocean ('the peaceful one')."},
    {q:"ten- / tain-",a:"hold",why:"reTAIN (keep hold of), conTAIN (hold inside), susTAIN (hold up), TENacious (holding on stubbornly)."},
    {q:"luc- / lum-",a:"light",why:"LUCid (clear), eLUCidate (shed light on), transLUCent (light passes through), LUMinous (glowing)."}
  ]},
  {name:"Analogy types",
   method:"Say the exact link in the first pair OUT LOUD ('a finger is PART OF a hand'), then find the pair with the same link. Naming the bridge is the whole trick.",
   cards:[
    {q:"Part → Whole",a:"Finger : Hand",why:"A finger is a part of a hand. Match: Petal : Flower, Page : Book."},
    {q:"Tool → User",a:"Wrench : Mechanic",why:"A mechanic uses a wrench. Match: Scalpel : Surgeon, Brush : Painter."},
    {q:"Cause → Effect",a:"Fire : Smoke",why:"Fire produces smoke. Match: Rain : Flood, Joke : Laughter."},
    {q:"Category → Member",a:"Bird : Robin",why:"A robin is a kind of bird. Match: Metal : Copper, Tree : Oak."},
    {q:"Degree (small → large)",a:"Warm : Hot",why:"Same idea, stronger. Match: Big : Huge, Sad : Devastated."},
    {q:"Function (object → use)",a:"Pen : Write",why:"A pen is used to write. Match: Knife : Cut, Key : Unlock."},
    {q:"Worker → Product",a:"Baker : Bread",why:"A baker makes bread. Match: Author : Book, Poet : Poem."},
    {q:"Object → Location",a:"Book : Library",why:"A book belongs in a library. Match: Car : Garage, Painting : Museum."}
  ]},
  {name:"Spatial heuristics",
   method:"Never try to hold the whole figure in your head. Pick ONE feature and follow only it through every step — the rest is noise.",
   cards:[
    {q:"Rotation",a:"Track ONE feature and step it",why:"Follow a single arrow tip or corner as it turns. Decide clockwise vs counter-clockwise, then move it that way."},
    {q:"Reflection (mirror)",a:"Flip across a line",why:"A mirror swaps left and right: b↔d, p↔q. Unlike rotation, a reflection reverses the shape (its 'handedness')."},
    {q:"Odd-one-out",a:"State the shared rule, find the breaker",why:"Say what 3 of the 4 have in common ('all point left'), then the one that breaks that rule is your answer."},
    {q:"Counting figures",a:"Count ONE changing attribute",why:"Track just the sides, or just the dots — not the whole picture. Counting everything at once is how you miscount."}
  ]}
];

// give each card a stable id (deck idx + card idx)
DECKS.forEach((d,di)=>d.cards.forEach((c,ci)=>c.id=`${di}-${ci}`));

// ==================== SVG TOKEN RENDER ====================
function tok(t){
  if(!t) return '<div class="w-14 h-14"></div>';
  if(t==='QMARK') return `<svg viewBox="0 0 40 40" class="w-14 h-14"><text x="20" y="28" text-anchor="middle" font-size="28" fill="#eaeaea">?</text></svg>`;
  if(t.startsWith('ARROW:')){
    const deg = +t.slice(6);
    return `<svg viewBox="0 0 40 40" class="w-14 h-14"><g transform="rotate(${deg} 20 20)"><line x1="20" y1="32" x2="20" y2="8" stroke="#eaeaea" stroke-width="2"/><polyline points="14,14 20,8 26,14" fill="none" stroke="#eaeaea" stroke-width="2"/></g></svg>`;
  }
  if(t.startsWith('CORNER:')){
    const pos = t.slice(7);
    const map={TL:[6,6],TR:[26,6],BL:[6,26],BR:[26,26]};
    const [x,y]=map[pos]||[6,6];
    return `<svg viewBox="0 0 40 40" class="w-14 h-14"><rect x="6" y="6" width="28" height="28" stroke="#eaeaea" stroke-width="2" fill="none"/><rect x="${x}" y="${y}" width="8" height="8" fill="#eaeaea"/></svg>`;
  }
  if(t.startsWith('DOTS:')){
    const n = +t.slice(5);
    let dots=''; for(let i=0;i<n;i++){const cx=8+(i%3)*12, cy=8+Math.floor(i/3)*12; dots+=`<circle cx="${cx}" cy="${cy}" r="3" fill="#eaeaea"/>`;}
    return `<svg viewBox="0 0 40 40" class="w-14 h-14">${dots}</svg>`;
  }
  if(t.startsWith('SHAPE:')){
    const s = t.slice(6);
    const sides = {tri:3, sq:4, pent:5, hex:6}[s];
    if(s==='circ') return `<svg viewBox="0 0 40 40" class="w-14 h-14"><circle cx="20" cy="20" r="14" stroke="#eaeaea" stroke-width="2" fill="none"/></svg>`;
    let pts=''; for(let i=0;i<sides;i++){const a=(i*2*Math.PI/sides)-Math.PI/2; pts+=`${20+14*Math.cos(a)},${20+14*Math.sin(a)} `;}
    return `<svg viewBox="0 0 40 40" class="w-14 h-14"><polygon points="${pts}" stroke="#eaeaea" stroke-width="2" fill="none"/></svg>`;
  }
  return `<div class="text-xs">${t}</div>`;
}

// render option content (text or token)
function optRender(o){
  if(typeof o==='string' && /^(ARROW|CORNER|SHAPE|DOTS|QMARK)/.test(o)) return `<div class="flex items-center justify-center">${tok(o)}</div>`;
  return o;
}

// ==================== STATS HELPERS ====================
function statFor(id){ return STATS[id] || (STATS[id]={seen:0,correct:0,box:0,lastSession:-1}); }
function rec(id, correct, assisted){
  const s = statFor(id);
  s.seen++;
  // A hint-assisted correct answer is not clean evidence of mastery — record
  // the attempt but don't promote the Leitner box. A miss always demotes.
  if(correct){ s.correct++; if(!assisted) s.box = Math.min(4, s.box+1); }
  else { s.box = 0; }
  s.lastSession = SETTINGS.sessionCount;
  save(LS.itemStats, STATS);
  const q = QMAP[id];
  if(q) recSub(q, correct, assisted);
  // Current-form window + daily progress snapshot.
  RECENT.push(correct?1:0);
  if(RECENT.length > FORM_WIN) RECENT.shift();
  save(LS.recent, RECENT);
  logProgress();
}
// "Current form" — accuracy over the recent window. Unlike lifetime accuracy,
// this recovers as you improve, so it's the honest "am I getting better?" number.
function formAcc(){ return RECENT.length ? RECENT.reduce((a,b)=>a+b,0)/RECENT.length : 0; }
// Local calendar date key (YYYY-MM-DD) for daily snapshots.
function dayKey(ts){ const d = ts?new Date(ts):new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
// Upsert today's snapshot so the improvement view has one point per day.
function logProgress(){
  const answered = Object.values(STATS).reduce((s,x)=>s+x.seen,0);
  const life = answered ? Object.values(STATS).reduce((s,x)=>s+x.correct,0)/answered : 0;
  const mastered = ALLSUBS.filter(isMastered).length;
  const bestExam = HIST.reduce((b,e)=>e.score>b?e.score:b, 0);
  PROGRESS[dayKey()] = {answered, life:+life.toFixed(3), form:+formAcc().toFixed(3), mastered, bestExam};
  save(LS.progress, PROGRESS);
}
// Minimal inline sparkline (no libs) for a 0..1 series.
function sparkline(vals, w=220, h=36){
  if(vals.length<2) return '';
  const max=Math.max(...vals,0.01), min=Math.min(...vals,0);
  const rng = (max-min)||1;
  const pts = vals.map((v,i)=>{
    const x = (i/(vals.length-1))*(w-4)+2;
    const y = h-2-((v-min)/rng)*(h-4);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>`;
}
// Roll a subtype's mastery window. Assisted CORRECT answers are excluded from
// the window (no mastery credit for a nudge); assisted misses still count.
function recSub(q, correct, assisted){
  const k = subKey(q);
  const ss = SUBSTAT[k] || (SUBSTAT[k] = {att:0, ok:0, recent:[]});
  ss.att++; if(correct) ss.ok++;
  if(!assisted || !correct){
    ss.recent.push(correct?1:0);
    if(ss.recent.length > MASTERY_WIN) ss.recent.shift();
  }
  save(LS.subStats, SUBSTAT);
}
// Mastery snapshot for one subtype key.
function masteryFor(k){
  const ss = SUBSTAT[k];
  if(!ss || ss.att===0) return {att:0, wacc:0, pct:0, tier:'new', mastered:false};
  const win = ss.recent;
  const wacc = win.length ? win.reduce((a,b)=>a+b,0)/win.length : 0;
  const mastered = win.length>=MASTERY_MIN && wacc>=MASTERY_ACC;
  const pct = mastered ? 100 :
    Math.round(Math.min(1, win.length/MASTERY_MIN) * Math.min(1, wacc/MASTERY_ACC) * 100);
  const tier = mastered ? 'mastered' : (ss.att>=3 ? 'learning' : 'new');
  return {att:ss.att, wacc, pct, tier, mastered};
}
function isMastered(k){ return masteryFor(k).mastered; }
function acc(id){ const s=STATS[id]; return s && s.seen ? s.correct/s.seen : 0.5; }
// Empirical difficulty: nudge the authored d by how the item actually plays.
// An item everyone misses is effectively harder than its label; one everyone
// aces is easier. Only kicks in after a few attempts so it stays stable.
function effD(q){
  const s = STATS[q.id];
  if(!s || s.seen < 3) return q.d;
  const a = s.correct/s.seen;
  return clamp(q.d + (0.55 - a)*1.5, MIND, MAXD);
}
function catAcc(cat){
  const ids = QUESTIONS.filter(q=>q.c===cat).map(q=>q.id);
  let seen=0, correct=0;
  ids.forEach(id=>{const s=STATS[id]; if(s){seen+=s.seen; correct+=s.correct;}});
  return {seen, correct, acc: seen?correct/seen:0};
}
// The weakest subtype you have NOT yet mastered — this is the remediation
// target Practice steers toward. Mastered subtypes are excluded so effort
// keeps flowing to open gaps rather than re-drilling proven ground.
function weakestOpenSub(){
  const open = ALLSUBS
    .map(k=>({k, m:masteryFor(k)}))
    .filter(x=>x.m.att>=3 && !x.m.mastered)
    .sort((a,b)=>a.m.wacc-b.m.wacc);
  return open[0] ? {k:open[0].k, acc:open[0].m.wacc, pct:open[0].m.pct} : null;
}
// Overall mastery: share of all subtypes cleared.
function masteryProgress(){
  const mastered = ALLSUBS.filter(isMastered).length;
  return {mastered, total:ALLSUBS.length, pct: ALLSUBS.length? Math.round(mastered/ALLSUBS.length*100):0};
}

// ==================== PRACTICE ====================
let practiceState = null;

const rand = arr => arr[Math.floor(Math.random()*arr.length)];
// Keep a candidate set inside the learner's zone of proximal development:
// items whose EFFECTIVE difficulty sits within a band of the current level.
function zpdBand(arr, level){
  const near = arr.filter(q=>Math.abs(effD(q)-level)<=0.75);
  return near.length ? near : arr;
}
// Interleave: prefer a different subtype than the one just answered.
function interleave(arr, lastSub){
  const diff = lastSub ? arr.filter(q=>q.sub!==lastSub) : arr;
  return diff.length ? diff : arr;
}
// Serve one item from a candidate set, avoiding recent repeats. When a small
// subtype pool (e.g. only ~10 deduction items) is getting hammered by
// remediation, this spreads items out instead of re-drawing the same handful
// back-to-back. Falls back gracefully so it never returns nothing.
function serveFresh(cands, lastSub){
  if(!cands.length) return null;
  let pool = interleave(cands, lastSub);
  const recent = (practiceState && practiceState.recentIds) || [];
  let fresh = pool.filter(q=>!recent.includes(q.id));       // not shown recently
  if(!fresh.length) fresh = pool.filter(q=>q.id!==(practiceState&&practiceState.lastId)); // at least not the exact last one
  if(!fresh.length) fresh = pool;
  return rand(fresh);
}
// Practice item selection, in priority order:
//   1. Spaced review  — a "due" Leitner item (retrieval at the edge of forgetting)
//   2. Remediation    — the weakest un-mastered subtype, inside the ZPD band
//   3. Maintenance    — an occasional mastered-subtype item to keep it sharp
//   4. Exploration    — anything in-band, interleaved
// Everything is filtered to the ZPD, interleaved, and de-duped against recent
// items before it's served.
function pickPracticeItem(cat){
  const pool = cat==='all' ? QUESTIONS.slice() : QUESTIONS.filter(q=>q.c===cat);
  const level = practiceState?.level || 2;
  const lastSub = practiceState?.lastSub;
  const notMastered = pool.filter(q=>!isMastered(subKey(q)));
  const r = Math.random();

  // 1) Spaced review — due box>0 items not already seen this session.
  const due = pool.filter(q=>{const s=STATS[q.id]; return s && s.box>0 && s.lastSession!==SETTINGS.sessionCount;});
  if(due.length && r<0.30){
    return serveFresh(zpdBand(due, level), lastSub);
  }

  // 2) Remediation — steer toward the weakest open subtype. Use the FULL
  // subtype pool (not the ZPD band): remediation is about covering the whole
  // subtype, and banding a small pool (e.g. ~10 deduction items) down to a
  // couple in-band items is exactly what causes visible repeats.
  const weak = weakestOpenSub();
  if(weak && r<0.75){
    const [wc, ws] = weak.k.split('/');
    const wItems = pool.filter(q=>q.c===wc && q.sub===ws);
    if(wItems.length) return serveFresh(wItems, null);
  }

  // 3) Maintenance — a light trickle of already-mastered material (~1 in 8).
  const mastered = pool.filter(q=>isMastered(subKey(q)));
  if(mastered.length && notMastered.length && r>0.875){
    return serveFresh(zpdBand(mastered, level), lastSub);
  }

  // 4) Exploration — in-band, interleaved; bias toward not-yet-mastered.
  const base = notMastered.length ? notMastered : pool;
  return serveFresh(zpdBand(base, level), lastSub);
}

// One-line strategy nudges for the hint scaffold — a "more knowledgeable other"
// prompt that supports the attempt without giving the answer. Keyed by subtype
// with a per-category fallback, so it degrades gracefully for any bank.
const STRATEGY_SUB = {
  // Numerical
  series:"Find the step between terms — constant? multiplying? gaps growing? two series interleaved?",
  percent:"10% moves the decimal one place; build the rest from that.",
  wordmath:"Translate each phrase into an equation before you compute anything.",
  average:"Average = sum ÷ count. Work back to the total sum first.",
  ratio:"Split the total by (a+b) to size one part, then scale.",
  // Verbal
  synonym:"Guess the word's meaning in a sentence, then find the closest match.",
  antonym:"Pin down the word's meaning first, then look for its opposite — not a synonym trap.",
  analogy:"Name the relationship in the first pair, then apply that exact relationship.",
  oddoneout:"State the property the others share, then find the one that breaks it.",
  sentence:"Read for the logical connector (but, because, however) — it dictates the missing word.",
  // Logic
  deduction:"Only what MUST follow counts. Reject anything merely possible.",
  syllogism:"'Some/all' don't chain. Only a valid form (e.g. modus tollens) yields a conclusion.",
  ordering:"Sketch the sequence on scratch — anchor the fixed clues first.",
  relations:"Map who-relates-to-whom as a small diagram before answering.",
  letterpattern:"Convert letters to positions (A=1, B=2…) and look for the number pattern.",
  // Spatial
  abstractpattern:"Track a single changing attribute across the set — count, rotation, or shading.",
  rotation:"Track ONE feature (an arrow tip or corner) and step it around. CW vs CCW.",
  corner:"Follow one marked corner through each step.",
  count:"Count a single changing element (sides, dots), not the whole figure.",
  oddfigure:"State the shared rule, then find the figure that violates it.",
  mirror:"Mirror across the line — b↔d, p↔q. Chirality flips; rotation doesn't.",
  polygon:"Count sides / vertices and track how that number changes.",
};
const STRATEGY_CAT = {
  Numerical:"Estimate first to kill obviously-wrong options, then compute.",
  Verbal:"Define the key word precisely; eliminate options that don't fit the relationship.",
  Logic:"Only what MUST follow counts — reject anything merely plausible.",
  Spatial:"Track a single changing attribute, not the whole figure.",
};
function hintFor(q){ return STRATEGY_SUB[q.sub] || STRATEGY_CAT[q.c] || "Eliminate what can't be right, then decide between the rest."; }

// The hint scaffold: a strategy nudge + one wrong option removed. Using it
// flags the attempt as "assisted" so a correct answer earns no mastery credit.
function renderHintArea(){
  const el = document.getElementById('p-hint');
  if(!el) return;
  const q = practiceState.current;
  if(practiceState.showAns){ el.innerHTML=''; return; }
  if(practiceState.hintUsed){
    el.innerHTML = `<div class="p-3 rounded-lg text-sm" style="background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.4);color:#eab308;">💡 ${hintFor(q)}</div>`;
    return;
  }
  el.innerHTML = `<button class="btn text-xs" id="p-hint-btn">💡 Need a nudge? (removes one wrong answer)</button>`;
  document.getElementById('p-hint-btn').addEventListener('click', useHint);
}
function useHint(){
  if(practiceState.showAns || practiceState.hintUsed) return;
  const q = practiceState.current;
  practiceState.hintUsed = true;
  practiceState.assisted = true;
  // Disable one wrong, still-enabled option.
  const wrong = [...document.querySelectorAll('#p-opts .opt')].filter(b=>+b.dataset.i!==q.a && !b.disabled);
  if(wrong.length){ const b = rand(wrong); b.disabled = true; b.style.opacity = .35; b.style.textDecoration = 'line-through'; }
  renderHintArea();
}

function answerPractice(idx){
  const q = practiceState.current;
  if(practiceState.showAns) return;
  const correct = idx === q.a;
  const assisted = practiceState.assisted;
  practiceState.showAns = true;
  practiceState.sessionQ++;
  practiceState.times.push((Date.now()-practiceState.qStart)/1000);
  // Adaptive difficulty rides the full bank range (MIND..MAXD), not a fixed cap.
  // Assisted correct answers don't push difficulty up — they weren't unaided.
  if(correct){
    practiceState.sessionOk++;
    if(!assisted){
      practiceState.streak.correct++;
      practiceState.streak.miss = 0;
      if(practiceState.streak.correct>=2 && practiceState.level<MAXD){
        practiceState.level = Math.min(MAXD, practiceState.level+0.5);
        practiceState.streak.correct = 0;
      }
    }
  } else {
    practiceState.streak.miss++;
    practiceState.streak.correct = 0;
    if(practiceState.streak.miss>=2 && practiceState.level>MIND){
      practiceState.level = Math.max(MIND, practiceState.level-0.5);
      practiceState.streak.miss = 0;
    }
  }
  rec(q.id, correct, assisted);
  const hintEl = document.getElementById('p-hint'); if(hintEl) hintEl.innerHTML='';
  document.querySelectorAll('#p-opts .opt').forEach((b,i)=>{
    b.disabled = true;
    if(i===q.a) b.classList.add('ok');
    else if(i===idx) b.classList.add('no');
  });
  practiceState.lastSub = q.sub;
  const fb = document.getElementById('p-feedback');
  fb.innerHTML = `
    <div class="p-4 rounded-lg" style="background:${correct?'rgba(74,222,128,.08)':'rgba(248,113,113,.08)'};border:1px solid ${correct?'var(--acc)':'var(--bad)'};">
      <div class="font-bold mb-1" style="color:${correct?'var(--acc)':'var(--bad)'};">${correct?(assisted?'Correct (with a hint)':'Correct'):'Wrong'}</div>
      ${correct&&assisted?`<div class="text-xs mb-1" style="color:#eab308;">No mastery credit — try the next one unaided.</div>`:''}
      <div class="text-sm text-gray-300">${q.e}</div>
      <button class="btn btn-p mt-3" id="p-next">Next →</button>
    </div>
  `;
  document.getElementById('p-next').addEventListener('click', ()=>{
    practiceState.current = null; practiceState.showAns = false; render();
  });
}

// ==================== EXAM ====================
let examState = null;

function buildExam(){
  const byCat = {};
  CATS.forEach(c=> byCat[c] = QUESTIONS.filter(q=>q.c===c).slice());
  const targets = {};
  CATS.forEach(c=> targets[c] = Math.round(EXAM_LEN*WEIGHTS[c]));
  // adjust rounding to hit EXAM_LEN
  let total = Object.values(targets).reduce((a,b)=>a+b,0);
  while(total<EXAM_LEN){ targets.Verbal++; total++; }
  while(total>EXAM_LEN){ targets.Verbal--; total--; }
  let picked = [];
  CATS.forEach(c=>{
    const src = byCat[c];
    for(let i=src.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[src[i],src[j]]=[src[j],src[i]];}
    picked = picked.concat(src.slice(0, Math.min(targets[c], src.length)));
  });
  // ramp difficulty easy→hard
  picked.sort((a,b)=>a.d-b.d);
  // when we run out of a real bank, pad by resampling
  while(picked.length<EXAM_LEN){ picked.push(QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)]); }
  return picked.slice(0,EXAM_LEN);
}

  `;
  document.querySelectorAll('#e-opts .opt').forEach(b=>b.addEventListener('click', ()=>answerExam(+b.dataset.i)));
}

function startExam(){
  examState = {qs:buildExam(), i:0, ans:[], timeLeft:EXAM_TIME, tabBlurs:0, finished:false, startAt:Date.now()};
  window.addEventListener('blur', examBlurHandler);
  document.addEventListener('visibilitychange', examBlurHandler);
  examState.timer = setInterval(()=>{
    examState.timeLeft--;
    const el = document.getElementById('e-clock');
    if(el){ el.textContent = fmtTime(examState.timeLeft); if(examState.timeLeft<60) el.classList.add('text-red-400'); }
    if(examState.timeLeft<=0) finishExam();
  }, 1000);
  render();
}

function examBlurHandler(){
  if(!examState || examState.finished) return;
  if(document.hidden || !document.hasFocus()){
    examState.tabBlurs++;
    document.getElementById('blur-modal').style.display = 'flex';
  }
}

function answerExam(idx){
  const q = examState.qs[examState.i];
  examState.ans.push({id:q.id, chosen:idx, correct:idx===q.a, cat:q.c, sub:q.sub});
  examState.i++;
  if(examState.i>=EXAM_LEN) finishExam();
  else render();
}

function finishExam(){
  clearInterval(examState.timer);
  window.removeEventListener('blur', examBlurHandler);
  document.removeEventListener('visibilitychange', examBlurHandler);
  examState.finished = true;
  const score = examState.ans.filter(a=>a.correct).length;
  const dur = EXAM_TIME - examState.timeLeft;
  const catAcc = {};
  CATS.forEach(c=>{
    const in_c = examState.ans.filter(a=>a.cat===c);
    catAcc[c] = in_c.length? in_c.filter(a=>a.correct).length/in_c.length : 0;
  });
  const entry = {ts:Date.now(), score, total:EXAM_LEN, dur, catAcc, tabBlurs:examState.tabBlurs};
  HIST.push(entry); save(LS.history, HIST);
  // credit stats too
  examState.ans.forEach(a=>rec(a.id, a.correct));
  logProgress();
  render();
}

function percentile(score){
  // rough curve from spec: 24→50, 31→80, 35→86, 40→95
  if(score>=40) return 95;
  if(score>=35) return 86;
  if(score>=31) return 80;
  if(score>=24) return 50;
  return Math.max(1, Math.round(score*2));
}

// ==================== LEARNING (Flashcards + SM-2-lite) ====================
let learnState = null;

function cardStat(id){ return CARDS[id] || (CARDS[id]={ease:2.5, iv:0, due:0}); }

function gradeCard(id, grade){
  // grade: 0=Again, 1=Hard, 2=Good, 3=Easy
  const c = cardStat(id);
  const now = Date.now();
  if(grade===0){ c.iv=0; c.ease=Math.max(1.3, c.ease-0.2); }
  else{
    c.ease = Math.max(1.3, c.ease + (grade===3? .15 : grade===2? 0 : -0.1));
    if(c.iv===0) c.iv = grade===1? 1 : grade===2? 2 : 4;
    else c.iv = Math.max(1, Math.round(c.iv * (grade===1? 1.2 : grade===2? c.ease : c.ease*1.3)));
  }
  c.due = now + c.iv * 24*60*60*1000;
  save(LS.cards, CARDS);
}

function isDue(id){ const c=CARDS[id]; return !c || c.due<=Date.now(); }

function buildLearnQueue(deckFilter){
  const decks = deckFilter==='all'? DECKS : DECKS.filter((_,i)=>i===+deckFilter);
  let due=[], fresh=[];
  decks.forEach(d=>d.cards.forEach(c=>{
    const cs = CARDS[c.id];
    if(!cs) fresh.push({card:c, deck:d.name});
    else if(isDue(c.id)) due.push({card:c, deck:d.name});
  }));
  // interleave: shuffle within
  for(const arr of [due, fresh]){
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  }
  return due.concat(fresh);
}

function renderLearning(){
  if(!learnState){ learnState = {deck:'all', queue:null, revealed:false, done:0}; }
  if(!learnState.queue) learnState.queue = buildLearnQueue(learnState.deck);
  if(learnState.queue.length===0){
    V.innerHTML = `
      <div class="mb-4 flex flex-wrap gap-3 items-center">
        <label class="text-xs text-gray-500">Deck

            <option value="all"${learnState.deck==='all'?' selected':''}>All decks (interleaved)</option>
            ${DECKS.map((d,i)=>`<option value="${i}"${learnState.deck===String(i)?' selected':''}>${d.name}</option>`).join('')}
          </select>
        </label>
        <span class="text-xs text-gray-500">Cards reviewed this session: <span class="mono text-white">${learnState.done}</span></span>
      </div>
      <div class="card p-8 text-center">
        <div class="text-4xl mb-2">✓</div>
        <div class="text-lg mb-2">All caught up!</div>
        <div class="text-sm text-gray-500 mb-4">No cards due right now. Spaced repetition works in your favor — come back tomorrow.</div>
        <button class="btn" onclick="learnState.queue=null;learnState.done=0;render();">Force-review anyway</button>
      </div>
    `;
    document.getElementById('l-deck').addEventListener('change', e=>{learnState.deck=e.target.value; learnState.queue=null; render();});
    return;
  }
  const cur = learnState.queue[0];

  // Teaching line shown on reveal: the card's own `why`, else the deck's method.
  const deckObj = DECKS[+String(card.id).split('-')[0]];

  const dueCount = learnState.queue.filter(x=>{const cs=CARDS[x.card.id]; return cs && isDue(x.card.id);}).length;
  const freshCount = learnState.queue.length - dueCount;
  V.innerHTML = `
    <div class="mb-4 flex flex-wrap gap-3 items-center">
      <label class="text-xs text-gray-500">Deck
        <select id="l-deck" class="ml-2">
          <option value="all"${learnState.deck==='all'?' selected':''}>All decks (interleaved)</option>
          ${DECKS.map((d,i)=>`<option value="${i}"${learnState.deck===String(i)?' selected':''}>${d.name}</option>`).join('')}
        </select>
      </label>
      <span class="pill">${learnState.queue.length} left · ${dueCount} due · ${freshCount} new</span>
      <span class="text-xs text-gray-500">Reviewed: <span class="mono text-white">${learnState.done}</span></span>
    </div>

    <div class="card p-8 mb-4 text-center min-h-64 flex flex-col justify-center">
      <div class="text-xs text-gray-500 mb-2">${deck}</div>
      <div class="text-2xl md:text-3xl mb-6 font-bold">${card.q}</div>
      ${learnState.revealed
        ? `<div class="text-lg text-gray-300 mb-3">${card.a}</div>
           ${teach? `<div class="text-sm text-gray-400 leading-relaxed mb-6 max-w-xl mx-auto text-left p-3 rounded-lg" style="background:#111;border:1px solid var(--border);"><span style="color:var(--acc);">How:</span> ${teach}</div>`:''}
           <div class="text-xs text-gray-500 mb-3">How well did you know it?</div>
           <div class="grid grid-cols-4 gap-2 max-w-xl mx-auto w-full">

             <button class="btn" data-g="3">Easy</button>
           </div>`
        : `<button class="btn btn-p" id="l-reveal">Reveal answer</button>`
      }
    </div>

  `;
  document.getElementById('l-deck').addEventListener('change', e=>{learnState.deck=e.target.value; learnState.queue=null; render();});
  if(!learnState.revealed){
    document.getElementById('l-reveal').addEventListener('click', ()=>{learnState.revealed=true; render();});
  } else {
    document.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click', ()=>{
      gradeCard(card.id, +b.dataset.g);
      learnState.queue.shift();
      learnState.done++;
      learnState.revealed=false;
      render();
    }));
  }
}

// Per-subtype mastery ladder — the criterion-referenced view. Each subtype is

function renderMasteryPanel(){
  const mp = masteryProgress();
  const tierMeta = {mastered:{c:'var(--acc)',l:'Mastered'}, learning:{c:'#eab308',l:'Learning'}, new:{c:'#6b7280',l:'New'}};
  const groups = CATS.map(cat=>{
    const subs = ALLSUBS.filter(k=>k.split('/')[0]===cat).sort();
    if(!subs.length) return '';
    const rows = subs.map(k=>{
      const m = masteryFor(k);

      return `<div class="mb-2">
        <div class="flex justify-between text-sm mb-1">
          <span>${sub} <span class="text-xs" style="color:${meta.c};">· ${meta.l}</span></span>

      </div>`;
    }).join('');
    return `<div class="mb-4"><div class="text-xs uppercase tracking-wide text-gray-500 mb-2">${cat}</div>${rows}</div>`;
  }).join('');

    <div class="card p-5 mb-4">

}

// Improvement over time — the "how much have I improved?" view. Compares the
// earliest recorded day to now across current-form accuracy, subtypes mastered,
// and best exam, with a sparkline of the daily form curve.
function renderImprovement(){
  logProgress(); // make sure today's point reflects the latest answer
  const days = Object.keys(PROGRESS).sort();
  const pts = days.map(d=>PROGRESS[d]);
  const now = pts[pts.length-1];
  if(!days.length || (now && now.answered===0)){
    return `<div class="card p-5 mb-4"><h3 class="font-bold mb-2">Your improvement</h3>
      <div class="text-sm text-gray-500">Answer some questions and your progress graph shows up here — recent-form accuracy, subtypes mastered, and best exam, tracked day by day.</div></div>`;
  }
  const first = pts[0];
  const multiDay = days.length >= 2;
  const delta = (a,b)=>{ const d=Math.round((b-a)); return d>0?`<span style="color:var(--acc);">▲ ${d}</span>`:d<0?`<span style="color:var(--bad);">▼ ${Math.abs(d)}</span>`:`<span class="text-gray-500">—</span>`; };
  const formSeries = pts.map(p=>p.form);
  const spark = sparkline(formSeries);
  const stat = (label, val, sub) => `<div class="p-3 rounded-lg" style="background:#111;border:1px solid var(--border);">
      <div class="text-xs text-gray-500">${label}</div>
      <div class="text-2xl font-bold mono">${val}</div>
      <div class="text-xs text-gray-500 mt-1">${sub}</div>
    </div>`;
  return `
    <div class="card p-5 mb-4">
      <div class="flex justify-between items-center mb-1">
        <h3 class="font-bold">Your improvement</h3>
        <span class="pill">${days.length} day${days.length>1?'s':''} tracked</span>
      </div>
      <div class="text-xs text-gray-500 mb-3">Current form = accuracy over your last ${FORM_WIN} answers${multiDay?`, since ${days[0]}`:''}.</div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
        ${stat('Current form', Math.round(now.form*100)+'%', multiDay?`from ${Math.round(first.form*100)}% &nbsp; ${delta(first.form*100, now.form*100)}`:'first day — keep going')}
        ${stat('Subtypes mastered', `${now.mastered}<span class="text-base text-gray-500">/${ALLSUBS.length}</span>`, multiDay?`from ${first.mastered} &nbsp; ${delta(first.mastered, now.mastered)}`:'start of your run')}
        ${stat('Best exam', now.bestExam?`${now.bestExam}<span class="text-base text-gray-500">/${EXAM_LEN}</span>`:'—', multiDay&&first.bestExam?`from ${first.bestExam} &nbsp; ${delta(first.bestExam, now.bestExam)}`:'take one in Exam')}
      </div>
      ${multiDay? `<div class="text-xs text-gray-500 mb-1">Form trend</div>${spark}`:''}
    </div>`;
}

// ==================== POMODORO ====================
let pomTimer = null;
let pomState = {running:false, mode:'focus', secLeft:0};
function pomTick(){
  if(!pomState.running) return;
  pomState.secLeft--;
  updatePomUI();
  if(pomState.secLeft<=0){
    pomState.mode = pomState.mode==='focus'?'break':'focus';
    pomState.secLeft = (pomState.mode==='focus'? (SETTINGS.deepSet?50:SETTINGS.pomLen): (SETTINGS.deepSet?10:SETTINGS.pomBreak))*60;
    SETTINGS.sessionCount++; save(LS.settings, SETTINGS);
    updatePomUI();
  }
}
function updatePomUI(){
  const clock = document.getElementById('pom-clock');
  const status = document.getElementById('pom-status');
  const btn = document.getElementById('pom-toggle');
  if(pomState.running){
    clock.textContent = fmtTime(pomState.secLeft);
    status.textContent = pomState.mode==='focus'? 'Focus':'Break';
    btn.textContent = 'Stop';
  } else {
    clock.textContent = '--:--';
    status.textContent = 'Idle';
    btn.textContent = 'Start Pomodoro';
  }
}
document.getElementById('pom-toggle').addEventListener('click', ()=>{
  if(pomState.running){
    pomState.running=false; clearInterval(pomTimer);
  } else {
    pomState.running=true; pomState.mode='focus';
    pomState.secLeft = (SETTINGS.deepSet?50:SETTINGS.pomLen)*60;
    pomTimer = setInterval(pomTick, 1000);
  }
  updatePomUI();
});
updatePomUI();

// ==================== KEYS ====================
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA') return;
  const k = e.key;
  if(currentTab==='practice' && practiceState){
    if(!practiceState.showAns && (k==='h'||k==='H')){ if(!practiceState.hintUsed) useHint(); }
    else if(!practiceState.showAns && ['1','2','3','4'].includes(k)){ answerPractice(+k-1); }
    else if(practiceState.showAns && (k==='ArrowRight' || k==='Enter')){ practiceState.current=null; practiceState.showAns=false; render(); }
  } else if(currentTab==='exam' && examState && !examState.finished){
    if(['1','2','3','4'].includes(k)) answerExam(+k-1);
  } else if(currentTab==='learning' && learnState){
    if(k===' '||k==='Enter'){ if(!learnState.revealed){ learnState.revealed=true; render(); e.preventDefault(); } }
    else if(learnState.revealed && ['1','2','3','4'].includes(k)){
      const cur = learnState.queue[0];
      if(cur){ gradeCard(cur.card.id, +k-1); learnState.queue.shift(); learnState.done++; learnState.revealed=false; render(); }
    }
  }
});
