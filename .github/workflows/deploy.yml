name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Re-deploy daily so fetch-substack picks up any new Substack posts.
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC every day
  workflow_dispatch:        # Manual "Run workflow" button in the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No npm dependencies — build scripts use Node.js built-ins + Bun's
      # built-in fetch. Nothing to install.
      - run: bun run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4

permissions:
  pages: write
  id-token: write
