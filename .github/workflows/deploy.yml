name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Re-deploy daily so fetch-substack picks up any new Substack posts.
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC every day
  workflow_dispatch:        # Manual "Run workflow" button in the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Only the fetch-substack script needs dependencies (node-fetch polyfill
      # via bun's built-in fetch — actually no deps needed). Install anyway in
      # case routes.config.mjs or other scripts have transitive imports.
      - run: bun install --frozen-lockfile
      - run: bun run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4

permissions:
  pages: write
  id-token: write
