name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Re-deploy daily so fetch-substack picks up any new Substack posts.
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC every day
  workflow_dispatch:        # Manual "Run workflow" button in the Actions tab

# Pages allows one deployment at a time. Two merges within a minute of each
# other used to start two runs, and the second was rejected outright with
# "due to in progress deployment" — leaving main deployed one commit behind.
# Queue instead of racing, and do not cancel: the first run is a real deploy
# of a real commit, not a stale preview.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# Build and deploy are two jobs, not two steps, and that is the whole point.
# As consecutive steps, deploy-pages asked the API for the artifact ~300ms
# after upload-pages-artifact finished writing it, and GitHub had not indexed
# it yet — "Found 0 artifact(s)", deploy fails, main stays live on the old
# build. It killed three of six deploys on 2026-11-24 and this site hands
# Pages a ~380MB artifact, which makes that indexing lag far more likely.
# A job boundary puts a runner handoff in the gap.
jobs:
  build:
    runs-on: ubuntu-latest
    # Force any action that still ships a Node 20 entrypoint onto Node 24.
    # GitHub flips the default on 2026-06-16; this env var lets the deploy
    # run on the newer runtime today without waiting for upstream releases.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No npm dependencies — build scripts use Node.js built-ins + Bun's
      # built-in fetch. Nothing to install.
      - run: bun run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
