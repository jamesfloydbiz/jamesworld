name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Re-deploy daily so the Substack RSS fetch in `bun run build` picks
  # up any new posts and re-prerenders /writing with them. Substack
  # publishing alone wouldn't trigger anything — this cron does.
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC every day
  workflow_dispatch:        # Manual "Run workflow" button in the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4

permissions:
  pages: write
  id-token: write
