<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RA Dashboard · Founders School</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/brand.css?v=9">
</head>
<body>
<div id="demoflag" class="demo-flag hidden">DEMO MODE — passcode is “demo”. Demo data, built in the structure of the Life360 API.</div>
<header class="bar">
  <div class="brand"><i>FS</i><div>Founders School<small>Student Life · Sign-out board</small></div></div>
  <div class="who hidden" id="who"><span id="clock"></span><button id="lock">Lock</button></div>
</header>

<div class="gate" id="gate">
  <div class="kicker">RA access</div><h2>Enter passcode</h2>
  <p class="sub">Student locations are private to Student Life.</p>
  <div id="gateErr"></div>
  <input class="field" id="pin" type="password" placeholder="Passcode" autocomplete="current-password">
  <div style="margin-top:12px"><button class="btn" id="unlock">Open board</button></div>
</div>

<main class="wrap wide hidden" id="board">
  <div id="demoTools" class="hidden" style="margin-bottom:12px;display:flex;gap:8px"><button class="btn small" id="seed">Load demo activity</button><button class="btn small ghost" id="reset">Reset demo</button></div>
  <div class="stats" id="stats"></div>
  <div class="dash">
    <div id="map"></div>
    <div>
      <div class="tabs"><button class="tab sel" data-tab="live">Live</button><button class="tab" data-tab="today">Today</button><button class="tab" data-tab="practices">Practices</button><button class="tab" data-tab="itinerary">Itinerary<span id="planDot"></span></button><button class="tab" data-tab="notes">Requests<span id="noteDot"></span></button><button class="tab" data-tab="roster">Roster</button></div>
      <div id="panel"></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/config.js?v=9"></script>
<script src="js/api.js?v=9"></script>
<script src="js/geo.js?v=9"></script>
<script src="js/calendar.js?v=9"></script>
<script src="js/life360.js?v=9"></script>
<script>
(function () {
  const C = FS_CONFIG, API = FS_API, { esc, time, minsLeft, phase, modeLabel, rideLabel } = FS, GEO = window.FS_GEO;
  const CAL = window.FS_CAL, L3 = window.FS_L360;
  const $ = (s) => document.querySelector(s);
  let pin = sessionStorage.getItem('fs_ra_pin') || '', data = { signouts: [], students: [] }, tab = 'live', map, layer, groupLayer;
  if (API.demo) { $('#demoflag').classList.remove('hidden'); $('#demoTools').classList.remove('hidden'); }

  async function unlock(p) {
    try { data = await API.dash(p); pin = p; sessionStorage.setItem('fs_ra_pin', p); show(); }
    catch (e) { pin = ''; sessionStorage.removeItem('fs_ra_pin'); $('#gate').classList.remove('hidden'); $('#gateErr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  }
  $('#unlock').onclick = () => unlock($('#pin').value);
  $('#pin').onkeydown = (e) => { if (e.key === 'Enter') unlock($('#pin').value); };
  $('#lock').onclick = () => { sessionStorage.removeItem('fs_ra_pin'); location.reload(); };
  $('#seed').onclick = async () => { await API.demoSeed(); draw.fitted = false; poll(); };
  $('#reset').onclick = async () => { await API.demoReset(); poll(); };
  if (API.demo && new URLSearchParams(location.search).get('peek')) {
    // The landing page frames the board to show it live. Demo mode only: with Supabase
    // configured the passcode is the only thing standing between a visitor and twenty
    // children's locations, and no query string gets to skip it.
    document.body.classList.add('peek');
    unlock(C.demoRaPin);
  } else if (pin) unlock(pin);

  function show() {
    $('#gate').classList.add('hidden'); $('#board').classList.remove('hidden'); $('#who').classList.remove('hidden');
    if (!map) {
      map = L.map('map').setView([C.house.lat, C.house.lng], 13);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
      layer = L.layerGroup().addTo(map);
      /* Where the house is, place by place. Redrawn whole on every poll, because a count
         is cheap to rebuild and a stale count is worse than a flicker. Students in motion
         are NOT in here -- they are persistent markers so they can be animated. */
      groupLayer = L.layerGroup().addTo(map);
      // One pin per flat, each carrying its own headcount.
      C.houses.forEach((h) => {
        homeMarkers[h.key] = L.marker([h.lat, h.lng], { icon: homeIcon(0, h.short), zIndexOffset: 500 }).addTo(map);
      });
      // The school used to be a static chip for orientation. Now that the board tracks the
      // whole roster it carries a count like anywhere else -- for most of the day it is
      // where the house is, and a board that could not say so would be odd.
      L3.onLeg(() => { if (pin) draw(); });     // one redraw when a routed leg lands
      /* Zoom housekeeping. The moving dots ease between the positions their tick hands
         them, which is right while the map is still and wrong while it is zooming --
         Leaflet drives that with transforms on the same elements, so without this every
         dot slides across the screen and lands late. Ticking pauses too, for the same
         reason. And below zoom 12 the stickers overlap into a stack nobody can read, so
         they step back to the dots alone. */
      const el = map.getContainer();
      map.on('zoomstart movestart', () => el.classList.add('zooming'));
      map.on('zoomend moveend', () => { el.classList.remove('zooming'); tickTrack(); declutter(); });
      setInterval(poll, C.pollMs);
    }
    draw();
  }
  /* A bare catch here hid a render error for an entire session: the board kept polling,
     the panel kept its last contents, and nothing anywhere said why half the map had
     stopped appearing. Network failures are expected and stay quiet; anything else is a
     bug and goes to the console. */
  async function poll() {
    if (!pin) return;
    let next;
    try { next = await API.dash(pin); } catch (e) { return; }
    data = next;
    try { draw(); } catch (e) { console.error('draw failed', e); }
  }

  const homeMarkers = {};
  const homeIcon = (n, label) => L.divIcon({ className: '', iconSize: [58, 58], iconAnchor: [29, 29],
    html: `<div class="m-home"><b>${n}</b><span>${esc(label || 'home')}</span></div>` });

  /* Where a pair is right now, from the clock rather than from a GPS feed: out along the leg,
     parked at the destination for the stay, then back along the same leg. SIMULATED -- the app
     records a trip, it does not track a phone or read a rideshare's position. */
  function leg(r) {
    if (r.status !== 'active' || !r.accepted_at) return null;
    const mins = (CAL.now() - new Date(r.accepted_at)) / 60000;
    const t = r.travel_min || 1;
    if (mins < t) return { phase: 'out', frac: mins / t };
    if (mins < t + (r.stay_min || 0)) return { phase: 'there', frac: 1 };
    const back = (mins - t - (r.stay_min || 0)) / t;
    return back >= 1 ? { phase: 'due', frac: 0 } : { phase: 'back', frac: 1 - back };
  }

  /* Road geometry for a sign-out's dotted line. A trip on the subway is deliberately NOT
     routed: there is no timetable data on the free tier, and drawing it down a car route
     would assert a path the app does not know. Those stay a straight line, which reads as
     "direction, not route". */
  const routes = new Map();       // signout id -> { line } | { until } while cooling off
  const homeOfTrip = (r) => CAL.places[CAL.homeOf(r.student.name)] || CAL.places[CAL.homes[0]];
  const PROFILE = { walk: 'foot', transit: null, shuttle: 'car', rideshare: 'car', parent: 'car' };
  const ROUTE_RETRY_MS = 120000;
  function ensureRoute(r) {
    const prof = PROFILE[moverKind(r)];
    if (!prof) return null;                       // transit: no honest geometry to draw
    const hit = routes.get(r.id);
    if (hit && hit.line) return hit.line;
    // A failed fetch used to be cached forever, so one dropped request left that trip drawn
    // as a straight line for the rest of the session. Cool off, then try again.
    if (hit && hit.until > Date.now()) return null;
    routes.set(r.id, { until: Date.now() + ROUTE_RETRY_MS });
    GEO.routeLine(prof, homeOfTrip(r), { lat: r.dest.lat, lng: r.dest.lng })
      .then((ln) => { routes.set(r.id, { line: ln }); if (data) draw(); })   // one redraw when it lands
      .catch(() => { routes.set(r.id, { until: Date.now() + ROUTE_RETRY_MS }); });
    return null;
  }
  const GLYPH = { shuttle: '\u{1F690}', rideshare: '\u{1F697}', parent: '\u{1F697}', walk: '\u{1F6B6}', transit: '\u{1F687}' };
  const moverKind = (r) => (r.ride && GLYPH[r.ride] ? r.ride
    : r.ride === 'walkOver' || r.mode === 'walk' ? 'walk'
    : r.ride === 'transitPass' || r.mode === 'transit' ? 'transit'
    : r.mode === 'car' ? 'rideshare' : 'walk');

  /* ── Always-on tracking ──────────────────────────────────────────────────
     Until now the board only knew about trips a student had signed out for, so between
     5pm and 10pm it mostly showed an empty map. Everyone has a schedule, so everyone has a
     position: at school, at the house, at an activity, or on the way between two of them.

     SIMULATED, and labelled as such everywhere it surfaces. The positions come from the
     published schedule and the clock, not from a phone. `js/life360.js` carries the mock in
     the real API's shape, so pointing this at a live circle changes one function. */
  const PLACE_KIND = { house: 'home', school: 'school' };
  // Venue names are long ("Open gym -- Henry Street Settlement"); tiles, chips and stickers
  // get the first couple of words, which is what anyone reads off them anyway.
  const short = (name) => String(name).split(/[\u2014,]/)[0].trim().split(/\s+/).slice(0, 2).join(' ').toLowerCase();
  /* A colour per journey, so no two dots on the move look alike, and a sticker on each one
     saying where it is going. Colours are claimed when a journey starts and released when
     it ends, rather than reassigned on every draw -- a dot that changed colour halfway
     across the map would be worse than no colour at all. Ordered to step around the colour
     wheel, because they are handed out in order and two adjacent journeys in amber and
     brown are two journeys nobody can tell apart. */
  const TRIP_COLORS = ['#E11D48', '#0891B2', '#EA580C', '#7C3AED', '#15803D',
                       '#DB2777', '#1D4ED8', '#65A30D', '#78350F', '#0F766E'];
  const tripColor = new Map();                 // journey key -> colour, held for its lifetime
  function claimColor(k) {
    if (tripColor.has(k)) return tripColor.get(k);
    const taken = new Set(tripColor.values());
    const c = TRIP_COLORS.find((x) => !taken.has(x)) || TRIP_COLORS[tripColor.size % TRIP_COLORS.length];
    tripColor.set(k, c); return c;
  }
  const groupIcon = (n, label, kind) => L.divIcon({ className: '', iconSize: [58, 30],
    // The flats and 180 Maiden Ln are a few hundred metres apart, so at the default zoom
    // a chip centred on the school lands under a house pin. Anchor it below its point.
    iconAnchor: kind === 'school' ? [29, -6] : [29, 15],
    html: `<div class="m-grp ${kind || ''} ${n ? '' : 'none'}">${n ? `<b>${n}</b>` : ''}<span>${esc(label)}</span></div>` });
  /* One dot per *journey*, not per student. Thirteen students leaving for the same open gym
     at the same moment are one group walking down one street, and drawing them as thirteen
     markers at identical coordinates produces a single illegible blob that also lies about
     how much the app knows. Keyed on (leg, departure), which is exact: same route, same
     start, same position for as long as they are on it. */
  const trackers = new Map();        // leg key -> marker, persistent so it can animate
  const legKey = (at) => `${at.from.key}>${at.place.key}|${at.mode}|${+at.since}`;
  const moverGroupIcon = (kind, n, color) => L.divIcon({ className: '', iconSize: [34, 34], iconAnchor: [17, 17],
    html: `<div class="m-move ${kind === 'walk' ? 'walk' : 'ride'}" style="--c:${color || 'var(--blue)'}">${GLYPH[kind] || GLYPH.walk}${n > 1 ? `<i>${n}</i>` : ''}</div>` });
  /* The routing sticker: a label pinned beside the dot, in that journey's colour, naming
     where it is headed. Journeys on one road sit close together, so stickers alternate
     sides and step down the screen rather than landing on top of each other. */
  const sticker = (mk, text, color, side, dy) => {
    const left = side === 'left';
    mk.bindTooltip(esc(text), { permanent: true, direction: left ? 'left' : 'right',
      offset: [left ? -14 : 14, dy || 0], className: 'm-sticker', opacity: 1 });
    mk.__c = color;
    // Bound after the marker joined the map, so Leaflet's own "open it on add" has already
    // been and gone. Open it here, and colour the element that creates.
    openSticker(mk);
  };
  /* Leaflet closes a permanent tooltip when its marker's icon is replaced, so anything that
     calls setIcon drops the sticker on the floor. Reopening is cheap and idempotent, and
     tickTrack calls it each pass, which also covers a redraw landing mid-animation. */
  /* Stickers are a fixed pixel size, so zooming out walks them into each other until the
     labels are an unreadable stack. A zoom threshold would be a guess -- how many collide
     depends on how many journeys there are and how far apart. Measure instead: keep each
     sticker that does not overlap one already kept, hide the rest. Zoom in and they come
     back. */
  function declutter() {
    const els = [...trackers.values()]
      .map((m) => m.getTooltip() && m.getTooltip().getElement()).filter(Boolean);
    els.forEach((e) => e.classList.remove('hid'));
    const kept = [];
    els.forEach((e) => {
      const r = e.getBoundingClientRect();
      // A little padding, because the dots are mid-transition when this measures and will
      // have drifted a few pixels by the time anyone looks.
      const hits = kept.some((k) => r.left < k.right + 7 && k.left < r.right + 7 &&
                                     r.top < k.bottom + 7 && k.top < r.bottom + 7);
      if (hits) e.classList.add('hid'); else kept.push(r);
    });
  }

  function openSticker(mk) {
    if (!mk.getTooltip()) return;
    if (!mk.isTooltipOpen()) mk.openTooltip(mk.getLatLng());
    const el = mk.getTooltip().getElement();
    if (el && mk.__c) el.style.setProperty('--c', mk.__c);
  }

  // A signout, expressed the same way CAL.locate() expresses a scheduled position, so the
  // two can be compared and the real one can win.
  function soPos(r) {
    const L0 = leg(r);
    const dest = { key: 'so:' + r.id, name: r.dest.name, address: r.dest.address || '', lat: r.dest.lat, lng: r.dest.lng };
    // From the student's own flat, not whichever one happens to be first in the config.
    const home = CAL.places[CAL.homeOf(r.student.name)] || CAL.places[CAL.homes[0]];
    const entry = { title: `${r.practice || r.purpose} \u00b7 signed out`, kind: 'signout' };
    if (!L0 || L0.phase === 'there' || L0.phase === 'due')
      return { state: 'at', place: dest, entry, since: new Date(r.accepted_at), signout: r };
    const to = L0.phase === 'out' ? dest : home, from = L0.phase === 'out' ? home : dest;
    return { state: 'transit', from, place: to, entry, frac: L0.frac, mode: r.mode === 'walk' ? 'walk' : r.mode === 'transit' ? 'transit' : 'car',
             travelMin: r.travel_min, since: new Date(r.accepted_at), signout: r };
  }
  function presence() {
    L3.roster = (data.students || []).map((s) => s.name);
    const ov = new Map();
    (data.signouts || []).filter((r) => r.status === 'active').forEach((r) => {
      const p = soPos(r); if (!p) return;
      ov.set(r.student.name, p); ov.set(r.buddy.name, p);     // a trip is a pair, both are out
    });
    return L3.headcount(CAL.now(), ov);
  }

  function drawTrack(hc) {
    if (!groupLayer) return;
    groupLayer.clearLayers();
    const seen = new Set();
    hc.groups.forEach((g, k) => {
      seen.add(k);
      if (CAL.isHome(k)) return;                        // each flat's own pin carries it
      const label = k === 'school' ? 'school' : short(g.place.name);
      L.marker([g.place.lat, g.place.lng], { icon: groupIcon(g.rows.length, label, PLACE_KIND[k]), zIndexOffset: 300 })
        .addTo(groupLayer)
        .bindTooltip(`<b>${esc(g.place.name)}</b><br>${esc(g.place.address || '')}` +
          `${g.rows[0] && g.rows[0].at.entry ? `<br><i>${esc(g.rows[0].at.entry.title)}</i>` : ''}` +
          `<br>${g.rows.length} student${g.rows.length === 1 ? '' : 's'}: ${esc(g.rows.map((r) => r.first).join(', '))}`,
          { className: 'm-tip' });
    });
    // The school is drawn even when empty, because an empty school at 9pm is information.
    if (!seen.has('school')) {
      const pl = CAL.places.school;
      L.marker([pl.lat, pl.lng], { icon: groupIcon(0, 'school', 'school'), zIndexOffset: 280 })
        .addTo(groupLayer)
        .bindTooltip(`<b>${esc(pl.name)}</b><br>${esc(pl.address)}<br>Nobody here right now`, { className: 'm-tip' });
    }
    /* Journeys. Markers live on `map`, not on a cleared layer, so they persist between
       polls and are eased along by their own tick rather than teleporting every four
       seconds. Each one gets its own colour, the route it is on is drawn in that colour,
       and a sticker on the dot names where it is going. */
    const byLeg = new Map();
    hc.transit.forEach((row) => {
      const k = legKey(row.at);
      if (!byLeg.has(k)) byLeg.set(k, { at: row.at, rows: [] });
      byLeg.get(k).rows.push(row);
    });
    const drawn = new Set();
    let n = 0;
    [...byLeg.entries()].sort((a, b) => a[0].localeCompare(b[0])).forEach(([k, grp]) => {
      const color = claimColor(k);
      const kind = grp.at.mode === 'walk' ? 'walk' : grp.at.mode === 'transit' ? 'transit' : 'rideshare';
      // One line per route, however many journeys are strung out along it -- drawing it
      // once per group would stack four dashed lines on one street.
      const pair = grp.at.from.key + '>' + grp.at.place.key;
      if (!drawn.has(pair)) {
        drawn.add(pair);
        const line = L3.leg(grp.at.from.key, grp.at.place.key, grp.at.mode, grp.at.from, grp.at.place);
        const path = line || [[grp.at.from.lat, grp.at.from.lng], [grp.at.place.lat, grp.at.place.lng]];
        L.polyline(path, { color: '#fff', weight: line ? 7 : 5, opacity: .8 }).addTo(groupLayer);
        L.polyline(path, { color, weight: line ? 3.5 : 2.5, opacity: .9, dashArray: line ? '7 6' : '2 8' })
          .addTo(groupLayer)
          .bindTooltip(line ? `${esc(grp.at.from.name)} \u2192 ${esc(grp.at.place.name)}`
                            : `${esc(grp.at.place.name)} \u00b7 direction only, the subway route is not drawn`);
      }
      const side = n % 2 ? 'left' : 'right', dy = (Math.floor(n / 2) % 3 - 1) * 15;
      n++;
      if (!trackers.has(k)) {
        const mk = L.marker([grp.at.from.lat, grp.at.from.lng],
          { zIndexOffset: 420, icon: moverGroupIcon(kind, grp.rows.length, color) }).addTo(map);
        sticker(mk, short(grp.at.place.name), color, side, dy);
        mk.bindPopup('', { className: 'm-pop', closeButton: false, offset: [0, -4] });
        trackers.set(k, mk);
      } else {
        const mk = trackers.get(k), sig = kind + '|' + grp.rows.length + '|' + color;
        if (mk.__sig !== sig) { mk.__sig = sig; mk.setIcon(moverGroupIcon(kind, grp.rows.length, color)); }
        openSticker(mk);
      }
      trackers.get(k).__sig = kind + '|' + grp.rows.length + '|' + color;
      trackers.get(k).__grp = grp;
    });
    [...trackers.keys()].forEach((k) => {
      if (!byLeg.has(k)) { map.removeLayer(trackers.get(k)); trackers.delete(k); tripColor.delete(k); }
    });
    tickTrack();
    requestAnimationFrame(declutter);
  }
  /* Positions are a function of the clock, which is why this can run between polls at all:
     it recomputes rather than interpolating towards a value the server sent. */
  function tickTrack() {
    if (!data.students || !data.students.length) return;
    // Leaflet drives its zoom with transforms on these same elements; nudging them at the
    // same time makes every dot slide across the screen and land late.
    if (map && map.getContainer().classList.contains('zooming')) return;
    trackers.forEach((mk) => {
      const grp = mk.__grp; if (!grp) return;
      const name = grp.rows[0].name;
      const at = grp.at.signout ? soPos(grp.at.signout) : CAL.locate(name, CAL.now());
      if (!at || at.state !== 'transit') return;
      const line = L3.leg(at.from.key, at.place.key, at.mode, at.from, at.place);
      const pt = line ? GEO.pointAt(line, at.frac)
        : [at.from.lat + (at.place.lat - at.from.lat) * at.frac, at.from.lng + (at.place.lng - at.from.lng) * at.frac];
      mk.setLatLng(pt);
      const mins = Math.max(0, Math.round((1 - at.frac) * (at.travelMin || CAL.travel(at.from.key, at.place.key).min)));
      const who = grp.rows.length > 3
        ? `${grp.rows.length} students` : grp.rows.map((r) => r.first).join(', ');
      /* Update the sticker, never rebind it: bindTooltip replaces the permanent tooltip
         with a fresh one, so calling it twice a second meant the sticker existed for about
         half a second and was then thrown away for the rest of the session. */
      const tip = mk.getTooltip();
      if (tip) {
        tip.setContent(`${esc(short(at.place.name))}<small>${mins} min \u00b7 ${esc(who)}</small>`);
        openSticker(mk);
      }
      /* The sticker is the tooltip, so the full detail -- which flat they left, where they
         are going, the address, who is with them -- goes in a popup on click. */
      if (mk.getPopup()) {
        mk.setPopupContent(`<b>${esc(grp.rows.map((r) => r.name).join(', '))}</b>` +
          `<br>${esc(at.from.name)} \u2192 <b>${esc(at.place.name)}</b>` +
          `<br>${esc(at.place.address || '')}` +
          `<br>${esc(modeLabel[at.mode] || at.mode)} \u00b7 ${mins} min to go` +
          (at.eta ? ` \u00b7 arrives ${time(at.eta)}` : '') +
          (at.next ? `<br>${esc(at.next.title)}` : ''));
      }
    });
    declutter();      // half a dozen rects twice a second; the dots never stop moving
  }

  const kindLabel = (k) => ((FS.noteKinds || []).find((x) => x.key === k) || {}).label || k;
  const COLORS = { pending: '#9CA3AF', active: '#0E9F6E', soon: '#F59E0B', overdue: '#DC2626' };
  const LABEL = { pending: 'Waiting on buddy', active: 'Out', soon: 'Due soon', overdue: 'Overdue' };
  const STATUS_TXT = { returned: 'Returned', declined: 'Declined', expired: 'Expired', cancelled: 'Cancelled' };

  function draw() {
    const open = data.signouts.filter((r) => r.status === 'pending' || r.status === 'active');
    const ph = (r) => phase(r);
    const out = open.filter((r) => r.status === 'active');
    const cnt = (k) => open.filter((r) => ph(r) === k).length;
    const roster = (data.students || []).length;
    const hc = presence();
    /* What the "out" number is made of, read off the same grouping the tile counts -- it
       used to come from sign-out purposes, which produced "0 out -- 2 food" the moment the
       two people in question were still walking there. */
    const bits = [...hc.groups.entries()]
      .filter(([k]) => !CAL.isHome(k) && k !== 'school')
      .sort((a, b) => b[1].rows.length - a[1].rows.length);
    const breakdown = bits.slice(0, 1).map(([, g]) => `${g.rows.length} ${esc(short(g.place.name))}`)
      .concat(bits.length > 1 ? [`+${bits.length - 1} more`] : []).join(' \u00b7 ');
    /* Five numbers that add up to the roster. That is the whole requirement: an RA at 9pm
       is not asking "how many trips are open", they are asking whether everyone is
       accounted for, and a set of tiles that does not sum cannot answer it. The last tile
       is students whose families have not agreed to location sharing -- they are accounted
       for by the schedule, not by a position, and saying so is more honest than quietly
       counting them as present. */
    const elsewhere = hc.out, miss = Math.max(0, roster - hc.house - hc.school - elsewhere - hc.moving - hc.unaccounted);
    $('#stats').innerHTML = `
      <div class="stat"><b>${hc.house}<small style="font-size:14px;color:var(--grey);font-weight:600"> / ${roster}</small></b><span>At home \u00b7 ${hc.homes.map((h) => `${h.n} ${esc(h.place.short)}`).join(', ')}</span></div>
      <div class="stat"><b>${hc.school}</b><span>At school</span></div>
      <div class="stat"><b>${elsewhere + miss}</b><span>Out${breakdown ? ' \u2014 ' + breakdown : ' at an activity'}</span></div>
      <div class="stat"><b>${hc.moving}</b><span>On the move</span></div>
      <div class="stat ${hc.offPlan.length ? 'warn' : ''}"><b>${hc.offPlan.length}</b><span>Off schedule</span></div>
      <div class="stat ${cnt('overdue') ? 'bad' : cnt('soon') ? 'warn' : ''}"><b>${cnt('overdue') || cnt('soon')}</b><span>${cnt('overdue') ? 'Overdue' : 'Due soon'}${cnt('pending') ? ' \u00b7 ' + cnt('pending') + ' waiting on a buddy' : ''}</span></div>
      <div class="stat sub"><b>${hc.unaccounted}</b><span>Location not shared</span></div>`;
    drawTrack(hc);
    const pd = $('#planDot'); if (pd) pd.textContent = hc.offPlan.length ? ` ${hc.offPlan.length}` : '';
    /* Each flat's pin carries its own count, and hovering it says which flat, where it is,
       and who is in it -- a circle with a number on it is not much use if you have to guess
       which building it means. */
    hc.homes.forEach((h) => {
      const mk = homeMarkers[h.key]; if (!mk) return;
      mk.setIcon(homeIcon(h.n, h.place.short));
      const rows = (hc.groups.get(h.key) || { rows: [] }).rows;
      mk.bindTooltip(`<b>${esc(h.place.name)}</b><br>${esc(h.place.address)}` +
        `<br>${h.n} of ${hc.roster} student${h.n === 1 ? '' : 's'} in` +
        (rows.length ? `<br>${esc(rows.map((r) => r.first).join(', '))}` : ''), { className: 'm-tip' });
    });
    const openNotes = (data.notes || []).filter((n) => !n.done_at).length;
    const dot = $('#noteDot'); if (dot) dot.textContent = openNotes ? ` ${openNotes}` : '';
    document.title = (cnt('overdue') ? `(${cnt('overdue')} overdue) ` : '') + 'RA Dashboard · Founders School';
    $('#clock').textContent = CAL.now().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + (CAL.shifted() ? ' (set)' : '');

    layer.clearLayers(); const pts = [[C.house.lat, C.house.lng]];
    if (C.school) pts.push([C.school.lat, C.school.lng]);
    open.forEach((r) => {
      const k = ph(r), ll = [r.dest.lat, r.dest.lng]; pts.push(ll);
      const path = ensureRoute(r);
      const hm = homeOfTrip(r);
      L.polyline(path || [[hm.lat, hm.lng], ll],
        { color: COLORS[k], weight: path ? 3 : 2, dashArray: path ? '6 7' : '2 7', opacity: path ? .75 : .5 })
        .addTo(layer)
        .bindTooltip(path ? `${esc(r.student.name.split(' ')[0])} \u2192 ${esc(r.dest.name)}`
                          : `${esc(r.dest.name)} \u00b7 direction only, the subway route is not drawn`);
      L.circleMarker(ll, { radius: 10, color: '#fff', weight: 3, fillColor: COLORS[k], fillOpacity: 1 }).addTo(layer)
        .bindTooltip(`<b>${esc(r.student.name)} + ${esc(r.buddy.name)}</b><br>${esc(r.dest.name)}${r.due_at ? '<br>Back by ' + time(r.due_at) : ''}`);
    });
    /* Anyone mid-journey is drawn once, by the tracking layer below -- it already knows
       about sign-outs, because presence() hands them to it as overrides. Drawing them here
       as well put the same pair on the map twice, in two places, disagreeing about the
       time. */
    /* Frame where the house actually is. One student at a climbing gym in Queens used to
       drag the view out until lower Manhattan was a smudge, so a far-off place only counts
       towards the frame if more than one person is there -- the rest stay reachable by
       zooming out, and their marker tooltip names them. */
    const FAR_KM = 5;
    const near = (pl, n) => n > 1 || C.houses.some((h) => GEO.haversineKm(h, pl) < FAR_KM);
    C.houses.forEach((h) => pts.push([h.lat, h.lng]));
    hc.groups.forEach((g) => { if (near(g.place, g.rows.length)) pts.push([g.place.lat, g.place.lng]); });
    hc.transit.forEach((r) => { if (near(r.at.place, 1)) pts.push([r.at.place.lat, r.at.place.lng]); });
    /* Then sit a step wider than the tightest fit. A crop that exactly contains the dots
       answers "where are they" but not "where is that", and the second question is the one
       someone looking at this map for the first time is asking. */
    if (!draw.fitted && pts.length > 1) {
      map.fitBounds(pts, { padding: [60, 60], maxZoom: 14 });
      map.setZoom(Math.max(11, map.getZoom() - 1), { animate: false });
      draw.fitted = true;
    }

    const panel = $('#panel');
    if (tab === 'live') {
      const order = { overdue: 0, soon: 1, active: 2, pending: 3 };
      const rows = [...open].sort((a, b) => order[ph(a)] - order[ph(b)]);
      panel.innerHTML = rows.map(card).join('') || '<div class="empty">Nobody is signed out. 🎉</div>';
    } else if (tab === 'today') {
      const cut = new Date(); cut.setHours(0, 0, 0, 0);
      const rows = data.signouts.filter((r) => new Date(r.created_at) >= cut && !(r.status === 'pending' || r.status === 'active'));
      panel.innerHTML = rows.map((r) => `<div class="so"><div class="top"><div><h3>${esc(r.student.name)} + ${esc(r.buddy.name)}</h3>
        <div class="line">${esc(r.dest.name)} · ${esc(r.purpose)}</div></div><span class="badge">${STATUS_TXT[r.status] || r.status}</span></div>
        <div class="line" style="margin-top:6px">Left ${time(r.created_at)}${r.returned_at ? ' · back ' + time(r.returned_at) : ''}${r.returned_at && r.due_at ? ` (${Math.round((new Date(r.returned_at) - new Date(r.due_at)) / 60000) > 0 ? Math.round((new Date(r.returned_at) - new Date(r.due_at)) / 60000) + ' min late' : 'on time'})` : ''}</div></div>`).join('') || '<div class="empty">Nothing closed out yet today.</div>';
    } else if (tab === 'notes') {
      /* The between-Town-Halls channel. Open ones first, because the point of this tab is the
         things still waiting on the RA, not an archive of what students have ever said. */
      const notes = data.notes || [];
      const openN = notes.filter((n) => !n.done_at), doneN = notes.filter((n) => n.done_at);
      const row = (n) => `<div class="so"><div class="top"><div><h3>${esc(n.from || 'A student')}</h3>
        <div class="line">${esc(kindLabel(n.kind))} \u00b7 ${time(n.created_at)}</div></div>
        <span class="badge ${n.done_at ? '' : 'soon'}">${n.done_at ? 'Handled' : 'Open'}</span></div>
        <div class="line" style="margin-top:8px">${esc(n.text)}</div>
        ${n.done_at ? '' : `<div class="actions"><button class="btn small green" data-done="${n.id}">Mark handled</button></div>`}</div>`;
      panel.innerHTML = (openN.map(row).join('') + doneN.map(row).join('')) ||
        '<div class="empty">No requests yet. Students send these from the sign-out app.</div>';
    } else if (tab === 'practices') {
      /* Everything the house is going to today, grouped by where. Built from the schedule
         rather than from sign-outs, which is why this used to read "no practice trips
         today" on a Monday with twelve students heading to open gym -- nobody signs out
         for something already on the calendar. */
      const today = CAL.now();
      const groups = new Map();
      (data.students || []).forEach((st) => {
        CAL.dayFor(st.name, today)
          .filter((e) => (e.kind === 'activity' || e.kind === 'community') && e.place !== 'house')
          .forEach((e) => {
            const k = e.title;
            if (!groups.has(k)) groups.set(k, { e, place: CAL.places[e.place], rows: [] });
            groups.get(k).rows.push(st.name);
          });
      });
      // Practice sign-outs sit alongside: those are trips somebody asked for, not scheduled.
      const cut = CAL.startOfDay(today);
      const trips = data.signouts.filter((r) => r.practice && new Date(r.created_at) >= cut);
      const byPractice = new Map();
      trips.forEach((r) => { if (!byPractice.has(r.practice)) byPractice.set(r.practice, []); byPractice.get(r.practice).push(r); });

      const now = +CAL.now();
      /* Position per student, from the same source the headcount uses -- so a student who
         signed out to get food does not also count as present at open gym. */
      const posOf = new Map();
      hc.groups.forEach((g) => g.rows.forEach((r) => posOf.set(r.name, r.at)));
      hc.transit.forEach((r) => posOf.set(r.name, r.at));
      hc.unshared.forEach((r) => posOf.set(r.name, r.at));
      const card = (g) => {
        const t = CAL.travel('house', g.e.place);
        // Live status for the group: who has left, who is on the way, who has arrived.
        let home = 0, moving = 0, there = 0, back = 0;
        g.rows.forEach((n) => {
          const at = posOf.get(n) || CAL.locate(n, now);
          if (at.state === 'transit') moving++;
          else if (at.place.key === g.e.place) there++;
          else if (now >= +g.e.end) back++;
          else home++;
        });
        const state = [there && `${there} there`, moving && `${moving} on the way`,
                       home && `${home} not left yet`, back && `${back} back`].filter(Boolean).join(' \u00b7 ');
        const done = now >= +g.e.end;
        return `<div class="so"><div class="top"><div><h3>${esc(g.e.title)}</h3>
          <div class="line">${FS.time(g.e.start)}\u2013${FS.time(g.e.end)} \u00b7 ${esc(g.place.address || g.place.name)}</div></div>
          <span class="badge ${there || moving ? 'soon' : ''}">${done ? 'done' : there || moving ? 'out' : 'later'}</span></div>
          <div class="line" style="margin-top:6px">${g.rows.length} student${g.rows.length === 1 ? '' : 's'} \u00b7
            ${esc(modeLabel[t.mode] || t.mode)}, about ${t.min} min each way</div>
          <div class="line">${esc(state || 'not started')}</div>
          <div class="line" style="margin-top:6px;color:var(--grey)">${esc(g.rows.map((n) => n.split(' ')[0]).join(', '))}</div></div>`;
      };
      const sched = [...groups.values()].sort((a, b) => a.e.start - b.e.start).map(card).join('');
      const signedOut = [...byPractice.entries()].map(([name, rows]) => {
        const late = rows.filter((r) => phase(r) === 'overdue').length;
        const byRide = new Map();
        rows.forEach((r) => { const k = r.ride || r.mode; byRide.set(k, (byRide.get(k) || 0) + 1); });
        return `<div class="so ${late ? 'overdue' : ''}"><div class="top"><div><h3>${esc(name)}</h3>
          <div class="line">signed out \u00b7 ${rows.length} trip${rows.length === 1 ? '' : 's'}</div></div>
          <span class="badge ${late ? 'overdue' : ''}">${late ? late + ' overdue' : 'signed out'}</span></div>
          <div class="line" style="margin-top:6px">${[...byRide.entries()].map(([k, n]) => `${n}\u00d7 ${esc(rideLabel[k] || modeLabel[k] || k)}`).join(' \u00b7 ')}</div>
          ${rows.map((r) => `<div class="line">${esc(r.student.name)} + ${esc(r.buddy.name)} \u2014 ${r.due_at ? 'back by ' + time(r.due_at) : 'waiting on a buddy'}</div>`).join('')}</div>`;
      }).join('');
      panel.innerHTML = `<div class="plan-head">${esc(CAL.dayName[CAL.dow(today)])} \u00b7 ${esc(CAL.eveningSlot[CAL.dow(today)])}</div>`
        + (sched + signedOut || '<div class="empty">Nothing on today.</div>');
    } else if (tab === 'itinerary') {
      /* Where every student is meant to be, and whether they are. The board already said
         who signed out; this says who did not and still went somewhere, which is the thing
         an RA cannot get from a list of trips.

         Off-schedule first, then anyone moving, then the rest -- the order an RA reads in. */
      const rank = (r) => (r.offPlan ? 0 : r.at.state === 'transit' ? 1 : r.at.place.key === 'house' ? 3 : r.at.place.key === 'school' ? 4 : 2);
      const rows = [...[...hc.groups.values()].flatMap((g) => g.rows), ...hc.transit, ...hc.unshared]
        .sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
      /* Most activity titles already name their venue ("Open gym -- Henry Street
         Settlement"), so printing the place as well reads as a stutter. Say the place only
         when the title has not already said it. */
      const placed = (a) => {
        const t = a.entry ? a.entry.title : '', pn = a.place.name;
        if (!t) return esc(pn);
        return t.includes(pn) || pn.includes(t) ? esc(t) : `${esc(t)} \u00b7 ${esc(pn)}`;
      };
      const line = (r) => {
        const a = r.at, nx = a.next || (a.planned && a.planned.next);
        const where = !r.shared ? 'Location not shared'
          : a.state === 'transit' ? `On the way to ${esc(a.place.name)}${a.eta ? ' \u00b7 about ' + time(a.eta) : ''}`
          : placed(a);
        const badge = r.offPlan ? '<span class="badge overdue">Off schedule</span>'
          : !r.shared ? '<span class="badge">Not shared</span>'
          : a.state === 'transit' ? '<span class="badge soon">Moving</span>'
          : a.signout ? '<span class="badge">Signed out</span>' : '';
        return `<div class="so ${r.offPlan ? 'overdue' : ''}"><div class="top"><div><h3>${esc(r.name)}</h3>
          <div class="line">${where}</div></div>${badge}</div>
          ${r.offPlan ? `<div class="line" style="margin-top:6px">Schedule says: <b>${placed(r.planned)}</b></div>` : ''}
          ${nx && r.shared ? `<div class="line" style="margin-top:6px">Next: ${esc(nx.title)} at ${time(nx.start)}</div>` : ''}</div>`;
      };
      const u = CAL.weeklyUpdate((data.students[0] || {}).name || CAL.names[0], CAL.now());
      panel.innerHTML =
        `<div class="plan-head">${CAL.dayName[CAL.dow(CAL.now())]}, ${CAL.fmtDate(CAL.now())} \u00b7 ${esc(CAL.eveningSlot[CAL.dow(CAL.now())])}
           <small>${CAL.shifted() ? 'Demo clock: ' + esc(CAL.now().toLocaleString()) : ''}</small></div>` +
        rows.map(line).join('') +
        `<details class="note-out"><summary>The note that went out to families \u2014 ${esc(u.label)}</summary>
          <div class="line" style="margin-top:8px"><b>Sent</b> ${esc(u.sentAt.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }))}, after Town Hall.</div>
          <div class="label">Town Hall log</div>${u.townHall.map((t) => `<div class="line">\u00b7 ${esc(t)}</div>`).join('')}
          <div class="label">Coming up that needs a parent</div>${u.needs.map((n) => `<div class="line">\u00b7 ${esc(n.day)}: ${esc(n.title)} \u2014 ${esc(n.consent)}</div>`).join('') || '<div class="line">Nothing this week.</div>'}
          <div class="line" style="margin-top:10px">Each family also gets their own child\u2019s highlights, week ahead and anecdotes.</div>
        </details>`;
    } else {
      panel.innerHTML = `<div class="card" style="margin-bottom:14px"><div class="label" style="margin-top:0">Add student</div>
        <input class="field" id="nn" placeholder="Full name"><div style="height:8px"></div><input class="field" id="ng" placeholder="Grade (optional)">
        <div style="margin-top:10px"><button class="btn small" id="add">Add</button></div></div>
        <div class="card">${data.students.map((s) => `<div class="roster-row"><span>${esc(s.name)} <small style="color:var(--grey);font-weight:500">${esc(s.grade || '')}</small></span><button class="link" data-rm="${s.id}">Remove</button></div>`).join('') || '<div class="empty">No students yet.</div>'}</div>`;
      $('#add').onclick = async () => { const n = $('#nn').value.trim(); if (!n) return; await API.addStudent(pin, n, $('#ng').value.trim()); poll(); };
    }
  }
  function card(r) {
    const k = phase(r), left = r.due_at ? minsLeft(r.due_at) : null;
    return `<div class="so ${k}"><div class="top"><div><h3>${esc(r.student.name)} + ${esc(r.buddy.name)}</h3>
      <div class="line">${esc(r.dest.name)} · ${esc(r.purpose)} · ${r.ride ? esc(rideLabel[r.ride] || r.ride) : modeLabel[r.mode]}</div></div><span class="badge ${k}">${LABEL[k]}</span></div>
      <div class="line" style="margin-top:8px">${r.status === 'pending'
        ? `Asked ${time(r.created_at)} · est. ${r.travel_min * 2 + r.stay_min} min total`
        : `Left ${time(r.accepted_at)} · back by <b>${time(r.due_at)}</b> · ${left >= 0 ? left + ' min left' : -left + ' min late'}`}</div>
      <div class="line">${esc(r.dest.address || '')}</div>
      ${r.status === 'active' ? `<div class="actions"><button class="btn small green" data-back="${r.id}">Mark back</button></div>` : ''}</div>`;
  }

  document.addEventListener('click', async (e) => {
    const t = e.target.closest('.tab'); if (t) { tab = t.dataset.tab; document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('sel', x === t)); draw(); return; }
    const b = e.target.closest('[data-back]'); if (b) { await API.raBack(pin, b.dataset.back); poll(); }
    const rm = e.target.closest('[data-rm]'); if (rm && confirm('Remove this student from the roster?')) { await API.removeStudent(pin, rm.dataset.rm); poll(); }
    const dn = e.target.closest('[data-done]'); if (dn) { await API.resolveNote(pin, dn.dataset.done); poll(); }
  });
  setInterval(() => { if (pin && data) draw(); }, 30000);
  setInterval(tickTrack, 500);
})();
</script>
</body>
</html>
