<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 508" width="1000" height="508" role="img" aria-label="Counted at the school. district records, authorizer counts, state registrations, federal school survey"><rect width="1000" height="508" rx="10" fill="#0a0a09"/><rect x="0.5" y="0.5" width="999" height="507" rx="10" fill="none" stroke="#1c1c1a"/><text x="34.0" y="44.0" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#f2efe9" text-anchor="start" font-weight="bold" opacity="1">Counted at the school</text><text x="34.0" y="68.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">district records, authorizer counts, state registrations, federal school survey</text><line x1="400.0" y1="100.0" x2="400.0" y2="404.0" stroke="#5c5952" stroke-width="1" opacity="1"/><rect x="358.2" y="105.0" width="41.8" height="32.0" rx="3" fill="#f0836b" opacity="1"/><text x="250.0" y="122.0" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#f2efe9" text-anchor="end" font-weight="normal" opacity="1">District</text><text x="250.0" y="140.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5952" text-anchor="end" font-weight="normal" opacity="1">2019-20 to 2024-25</text><text x="344.2" y="126.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#f0836b" text-anchor="end" font-weight="normal" opacity="1">-4.4%</text><text x="770.0" y="126.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">−1.9M students</text><rect x="400.0" y="181.0" width="139.7" height="32.0" rx="3" fill="#6ee7a8" opacity="1"/><text x="250.0" y="198.0" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#f2efe9" text-anchor="end" font-weight="normal" opacity="1">Charter</text><text x="250.0" y="216.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5952" text-anchor="end" font-weight="normal" opacity="1">2019-20 to 2024-25</text><text x="553.6" y="202.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#6ee7a8" text-anchor="start" font-weight="normal" opacity="1">+14.7%</text><text x="770.0" y="202.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">+492,000</text><rect x="400.0" y="257.0" width="90.2" height="32.0" rx="3" fill="#6ee7a8" opacity="1"/><text x="250.0" y="274.0" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#f2efe9" text-anchor="end" font-weight="normal" opacity="1">Private</text><text x="250.0" y="292.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5952" text-anchor="end" font-weight="normal" opacity="1">2019-20 to 2023-24</text><text x="504.2" y="278.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#6ee7a8" text-anchor="start" font-weight="normal" opacity="1">+9.5%</text><text x="770.0" y="278.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">+443,000</text><rect x="400.0" y="333.0" width="46.6" height="32.0" rx="3" fill="#6ee7a8" opacity="1"/><text x="250.0" y="350.0" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#f2efe9" text-anchor="end" font-weight="normal" opacity="1">Homeschool</text><text x="250.0" y="368.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5952" text-anchor="end" font-weight="normal" opacity="1">2024-25, one year</text><text x="460.6" y="354.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#6ee7a8" text-anchor="start" font-weight="normal" opacity="1">+4.9%</text><text x="770.0" y="354.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">36% of states at record highs</text><text x="34.0" y="446.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">All four are counted by the institutions themselves, so they are measured the same way.</text><text x="34.0" y="468.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">Homeschool is a single-year change; the others span four or five.</text></svg>