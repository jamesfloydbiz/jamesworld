font-size="10.5" fill="#5c5952" text-anchor="end" font-weight="normal" opacity="1">2019-20 to 2024-25</text><text x="553.6" y="202.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#6ee7a8" text-anchor="start" font-weight="normal" opacity="1">+14.7%</text><text x="770.0" y="202.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">+492,000</text><rect x="400.0" y="257.0" width="46.6" height="32.0" rx="3" fill="#6ee7a8" opacity="1"/><text x="250.0" y="274.0" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#f2efe9" text-anchor="end" font-weight="normal" opacity="1">Homeschool</text><text x="250.0" y="292.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5952" text-anchor="end" font-weight="normal" opacity="1">2024-25, one year</text><text x="460.6" y="278.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#6ee7a8" text-anchor="start" font-weight="normal" opacity="1">+4.9%</text><text x="770.0" y="278.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">36% of states at record highs</text><text x="34.0" y="370.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">Counted by the institutions themselves, so these three are measured the same way.</text><text x="34.0" y="392.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">Homeschool is a single-year change; the other two span five years.</text></svg>