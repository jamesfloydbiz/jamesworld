<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="The teacher pay penalty. wages against comparable college graduates"><rect width="1000" height="470" rx="10" fill="#0a0a09"/><rect x="0.5" y="0.5" width="999" height="469" rx="10" fill="none" stroke="#1c1c1a"/><text x="34.0" y="44.0" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#f2efe9" text-anchor="start" font-weight="bold" opacity="1">The teacher pay penalty</text><text x="34.0" y="68.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">wages against comparable college graduates</text><polyline points="280.0,160.0 740.0,330.0" fill="none" stroke="#f0836b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280.0" cy="160.0" r="6" fill="#f0836b"/><circle cx="740.0" cy="330.0" r="6" fill="#f0836b"/><text x="280.0" y="134.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" fill="#f2efe9" text-anchor="middle" font-weight="bold" opacity="1">93.9¢</text><text x="280.0" y="404.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8f8b84" text-anchor="middle" font-weight="normal" opacity="1">1996</text><text x="740.0" y="374.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" fill="#f0836b" text-anchor="middle" font-weight="bold" opacity="1">74.8¢</text><text x="740.0" y="404.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8f8b84" text-anchor="middle" font-weight="normal" opacity="1">2025</text><text x="34.0" y="444.0" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">Teacher weekly wages per dollar earned by comparable college graduates. Thirty years, one direction.</text></svg>