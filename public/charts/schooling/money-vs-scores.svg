n',serif" font-size="12" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">Indexed to 2019 = 100, so dollars and test scores share one axis.</text><text x="34.0" y="458.0" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#f2efe9" text-anchor="start" font-weight="normal" opacity="1">The money went up. The scores went down. Same four years.</text></svg>