mily="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8f8b84" text-anchor="end" font-weight="normal" opacity="1">pre-pandemic baseline</text><polyline points="110.0,247.5 525.0,147.8 663.3,167.2 801.7,183.8 940.0,190.5" fill="none" stroke="#e8bd63" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110.0" cy="247.5" r="4" fill="#e8bd63"/><text x="110.0" y="233.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#e8bd63" text-anchor="middle" font-weight="normal" opacity="1">15.0%</text><text x="110.0" y="386.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5952" text-anchor="middle" font-weight="normal" opacity="1">2018-19</text><circle cx="525.0" cy="147.8" r="4" fill="#e8bd63"/><text x="525.0" y="133.8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#e8bd63" text-anchor="middle" font-weight="normal" opacity="1">28.3%</text><text x="525.0" y="386.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5952" text-anchor="middle" font-weight="normal" opacity="1">2021-22</text><circle cx="663.3" cy="167.2" r="4" fill="#e8bd63"/><text x="663.3" y="153.2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#e8bd63" text-anchor="middle" font-weight="normal" opacity="1">25.7%</text><text x="663.3" y="386.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5952" text-anchor="middle" font-weight="normal" opacity="1">2022-23</text><circle cx="801.7" cy="183.8" r="4" fill="#e8bd63"/><text x="801.7" y="169.8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#e8bd63" text-anchor="middle" font-weight="normal" opacity="1">23.5%</text><text x="801.7" y="386.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" f