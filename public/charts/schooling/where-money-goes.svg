<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="Where the money goes. by object of expenditure"><rect width="1000" height="580" rx="10" fill="#0a0a09"/><rect x="0.5" y="0.5" width="999" height="579" rx="10" fill="none" stroke="#1c1c1a"/><text x="34.0" y="44.0" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#f2efe9" text-anchor="start" font-weight="bold" opacity="1">Where the money goes</text><text x="34.0" y="68.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">by object of expenditure</text><rect x="34.0" y="108.0" width="512.6" height="52.0" rx="2" fill="#6ee7a8" opacity="1"/><text x="290.3" y="140.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#0a0a09" text-anchor="middle" font-weight="bold" opacity="1">55%</text><text x="290.3" y="185.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#8f8b84" text-anchor="middle" font-weight="normal" opacity="1">Salaries</text><rect x="546.6" y="108.0" width="223.7" height="52.0" rx="2" fill="#7d9cc9" opacity="1"/><text x="658.4" y="140.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#0a0a09" text-anchor="middle" font-weight="bold" opacity="1">24%</text><text x="658.4" y="185.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#8f8b84" text-anchor="middle" font-weight="normal" opacity="1">Benefits</text><rect x="770.3" y="108.0" width="102.5" height="52.0" rx="2" fill="#e8bd63" opacity="1"/><text x="821.5" y="185.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#8f8b84" text-anchor="middle" font-weight="normal" opacity="1">Purchased services</text><rect x="872.8" y="108.0" width="93.2" height="52.0" rx="2" fill="#8f8b84" opacity="1"/><text x="919.4" y="185.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#8f8b84" text-anchor="middle" font-weight="normal" opacity="1">Everything else</text><text x="34.0" y="232.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">79% of it is people. That is not unusual — it is where every people-delivered service sits.</text><line x1="34.0" y1="254.0" x2="966.0" y2="254.0" stroke="#22221f" stroke-width="1" opacity="1"/><text x="230.0" y="297.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8f8b84" text-anchor="end" font-weight="normal" opacity="1">Retail</text><rect x="250.0" y="282.0" width="64.0" height="22.0" rx="2" fill="#5c5952" opacity="1"/><text x="326.0" y="297.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">10%</text><text x="230.0" y="337.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8f8b84" text-anchor="end" font-weight="normal" opacity="1">Restaurants</text><rect x="250.0" y="322.0" width="211.2" height="22.0" rx="2" fill="#5c5952" opacity="1"/><text x="473.2" y="337.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">33%</text><text x="230.0" y="377.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8f8b84" text-anchor="end" font-weight="normal" opacity="1">Hospitals</text><rect x="250.0" y="362.0" width="352.0" height="22.0" rx="2" fill="#5c5952" opacity="1"/><text x="614.0" y="377.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">55%</text><text x="230.0" y="417.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8f8b84" text-anchor="end" font-weight="normal" opacity="1">Home care</text><rect x="250.0" y="402.0" width="448.0" height="22.0" rx="2" fill="#5c5952" opacity="1"/><text x="710.0" y="417.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">70%</text><text x="230.0" y="457.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#f2efe9" text-anchor="end" font-weight="normal" opacity="1">Schools</text><rect x="250.0" y="442.0" width="505.6" height="22.0" rx="2" fill="#6ee7a8" opacity="1"/><text x="767.6" y="457.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#6ee7a8" text-anchor="start" font-weight="normal" opacity="1">79%</text><text x="230.0" y="497.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8f8b84" text-anchor="end" font-weight="normal" opacity="1">Police &amp; fire</text><rect x="250.0" y="482.0" width="556.8" height="22.0" rx="2" fill="#5c5952" opacity="1"/><text x="818.8" y="497.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">87%</text><text x="34.0" y="556.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">Staff compensation as a share of operating cost</text></svg>