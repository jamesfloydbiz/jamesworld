<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 302" width="1000" height="302" role="img" aria-label="Household survey. families self-reporting to the Census"><rect width="1000" height="302" rx="10" fill="#0a0a09"/><rect x="0.5" y="0.5" width="999" height="301" rx="10" fill="none" stroke="#1c1c1a"/><text x="34.0" y="44.0" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#f2efe9" text-anchor="start" font-weight="bold" opacity="1">Household survey</text><text x="34.0" y="68.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">families self-reporting to the Census</text><line x1="400.0" y1="100.0" x2="400.0" y2="176.0" stroke="#5c5952" stroke-width="1" opacity="1"/><rect x="400.0" y="105.0" width="266.0" height="32.0" rx="3" fill="#6ee7a8" opacity="1"/><text x="250.0" y="122.0" font-family="Georgia,'Times New Roman',serif" font-size="14.5" fill="#f2efe9" text-anchor="end" font-weight="normal" opacity="1">Private</text><text x="250.0" y="140.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#5c5952" text-anchor="end" font-weight="normal" opacity="1">against pre-pandemic</text><text x="680.0" y="126.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" fill="#6ee7a8" text-anchor="start" font-weight="normal" opacity="1">+28.0%</text><text x="770.0" y="126.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">Census household survey</text><text x="34.0" y="218.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">The school-based federal survey shows far less growth over the same period,</text><text x="34.0" y="240.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">and the two instruments differ by roughly 2.3 million students in level.</text><text x="34.0" y="262.0" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">Same question, two methods, two answers.</text></svg>