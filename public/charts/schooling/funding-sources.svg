<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-label="Where the money comes from. local 43%, state 45%, federal 12%"><rect width="1000" height="490" rx="10" fill="#0a0a09"/><rect x="0.5" y="0.5" width="999" height="489" rx="10" fill="none" stroke="#1c1c1a"/><text x="34.0" y="44.0" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#f2efe9" text-anchor="start" font-weight="bold" opacity="1">Where the money comes from</text><text x="34.0" y="68.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">local 43%, state 45%, federal 12%</text><rect x="34.0" y="110.0" width="402.6" height="54.0" rx="2" fill="#7d9cc9" opacity="1"/><text x="235.3" y="143.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#0a0a09" text-anchor="middle" font-weight="bold" opacity="1">43.2%</text><text x="235.3" y="190.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8f8b84" text-anchor="middle" font-weight="normal" opacity="1">Local</text><rect x="436.6" y="110.0" width="421.3" height="54.0" rx="2" fill="#6ee7a8" opacity="1"/><text x="647.3" y="143.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#0a0a09" text-anchor="middle" font-weight="bold" opacity="1">45.2%</text><text x="647.3" y="190.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8f8b84" text-anchor="middle" font-weight="normal" opacity="1">State</text><rect x="857.9" y="110.0" width="108.1" height="54.0" rx="2" fill="#e8bd63" opacity="1"/><text x="911.9" y="143.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#0a0a09" text-anchor="middle" font-weight="bold" opacity="1">11.6%</text><text x="911.9" y="190.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8f8b84" text-anchor="middle" font-weight="normal" opacity="1">Federal</text><text x="34.0" y="240.0" font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">The federal share is the small one — and it varies more than any other.</text><line x1="34.0" y1="262.0" x2="966.0" y2="262.0" stroke="#22221f" stroke-width="1" opacity="1"/><text x="180.0" y="305.0" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#f2efe9" text-anchor="end" font-weight="normal" opacity="1">Mississippi</text><rect x="200.0" y="289.0" width="635.6" height="26.0" rx="2" fill="#e8bd63" opacity="1"/><text x="847.6" y="305.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e8bd63" text-anchor="start" font-weight="normal" opacity="1">22.7%</text><text x="180.0" y="351.0" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#f2efe9" text-anchor="end" font-weight="normal" opacity="1">National average</text><rect x="200.0" y="335.0" width="324.8" height="26.0" rx="2" fill="#8f8b84" opacity="1"/><text x="536.8" y="351.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8f8b84" text-anchor="start" font-weight="normal" opacity="1">11.6%</text><text x="180.0" y="397.0" font-family="Georgia,'Times New Roman',serif" font-size="13.5" fill="#f2efe9" text-anchor="end" font-weight="normal" opacity="1">New Jersey</text><rect x="200.0" y="381.0" width="176.4" height="26.0" rx="2" fill="#7d9cc9" opacity="1"/><text x="388.4" y="397.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#7d9cc9" text-anchor="start" font-weight="normal" opacity="1">6.3%</text><text x="34.0" y="462.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#5c5952" text-anchor="start" font-weight="normal" opacity="1">Federal share of school revenue, by state</text></svg>